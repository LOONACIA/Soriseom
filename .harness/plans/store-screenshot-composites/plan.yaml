id: store-screenshot-composites
goal: >
  Store 스크린샷을 언어(ko-KR, en-US)마다 1920x1080 홍보 이미지 두 장으로 바꾼다. 지금 스크린샷은 작업 영역 전체를 찍어
  큰 빈 배경에 324x72px 팝업만 작게 보이고, 설정 창도 테마 항목이 생기기 전 화면이다. 새 구조에서는 스모크 스크립트의
  `storeshots` 시나리오가 재료(서로 다른 데모 곡과 앨범아트로 띄운 밝은·어두운 팝업 세 개, 현재 설정 창)를 찍고,
  새 Python 스크립트 `tools/store/compose_screenshots.py`가 브랜드 그라데이션 배경, 큰 제목, 크게 키워 겹친 팝업,
  강조색이 섞인 문구를 합성한다. 완료는 두 스크립트와 문서(CLAUDE.md 명령표, ADR-009, docs/store-listing.md의 스크린샷 절)가
  새 흐름을 설명하고, 검사 명령이 모두 통과하는 상태다. 실제 촬영과 이미지 확인은 계획이 끝난 뒤 Claude가 한다(ADR-009).
approved: true
steps:
  - id: s1-compose-script
    title: compose store screenshots from captured materials
    type: feat
    scope: tools
    description: |
      먼저 읽을 파일: CLAUDE.md("언어", "명령어"), tools/icons/render_icons.py(이 저장소의 Python 도구 스크립트 형식: PEP 723 머리말, argparse, `main() -> int`, `raise SystemExit(main())`), docs/store-listing.md("스크린샷" 절).

      목표: `tools/store/compose_screenshots.py`를 새로 만든다. 스모크 스크립트가 한 폴더에 저장한 재료 PNG를 읽어, 언어마다 1920x1080 Store 스크린샷 두 장을 같은 폴더에 쓴다.
      재료를 찍는 스모크 변경은 다음 스텝(s2)이 한다. 이 스텝은 아래 파일 이름 계약만 따른다.

      ## 실행 방법과 입출력
      - 머리말: `# /// script`, `requires-python = ">=3.12"`, `dependencies = ["pillow==13.0.0"]`(render_icons.py와 같은 Pillow 버전). 실행은 `uv run tools/store/compose_screenshots.py <폴더>`.
      - 위치 인자 하나 `folder`(재료가 있고 결과를 쓸 폴더). 다른 옵션은 만들지 마라. 이유: 요청받지 않은 설정 가능성이다. 모듈 docstring을 `argparse` description으로 쓴다.
      - 언어 `ko-KR`, `en-US` 각각에 대해 입력 네 개를 읽는다.
        - `store-material-<culture>-popup-1.png`: 밝은 테마 팝업(첫 데모 곡)
        - `store-material-<culture>-popup-2.png`: 어두운 테마 팝업(둘째 데모 곡)
        - `store-material-<culture>-popup-3.png`: 밝은 테마 팝업(셋째 데모 곡)
        - `store-material-<culture>-settings.png`: 밝은 테마 설정 창(보이는 창 테두리 그대로, 네 모서리 밖은 배경색)
        팝업 재료는 팝업 창의 경계 사각형을 화면에서 그대로 복사한 것이다. 알약 모양이 사각형을 꽉 채우고, 알약 밖 네 모서리에는 뒤 배경색이 있다. 크기는 360x80 DIP에 화면 배율을 곱한 값이라 PC마다 다르다.
      - 출력: `store-<culture>-1.png`(팝업 합성), `store-<culture>-2.png`(설정 합성). RGB PNG, 정확히 1920x1080. 저장할 때마다 경로를 한 줄 출력한다.
      - 어떤 언어의 입력이 하나라도 없으면 없는 파일 경로를 stderr에 쓰고 그 언어는 건너뛴다. 다른 언어는 계속 처리하고, 하나라도 건너뛰었으면 종료 코드 1, 아니면 0.
      - 글꼴: `C:\Windows\Fonts\NotoSansKR-VF.ttf`, 없으면 `%LOCALAPPDATA%\Microsoft\Windows\Fonts\NotoSansKR-VF.ttf`. 둘 다 없으면 그 사실을 stderr에 쓰고 종료 코드 1. 굵기는 `font.set_variation_by_name("Black")` 또는 `"Bold"`로 고른다. 영어도 같은 글꼴을 쓴다. `--help`는 글꼴을 찾기 전에 끝나야 한다.

      ## 공통 그리기 규칙(캔버스 1920x1080, 좌표는 픽셀)
      - 색: 강조 `AMBER = (251, 191, 36)`, 흰색 `(255, 255, 255)`.
      - 배경: 192x108 RGB 이미지에 `(13, 110, 104)`에서 `(30, 58, 168)`로 가는 그라데이션을 칠한다. 각 픽셀의 비율 `t = x / 192 * 0.55 + y / 108 * 0.45`. 이것을 BICUBIC으로 1920x1080까지 키운다. 그 위에 물결 장식을 그린다. 중심 `(1640, 250)`에 원 7개, 중심 `(260, 880)`에 원 6개. i번째(0부터) 원의 반지름은 `90 + i * 85`, 흰색 외곽선 두께 6, 알파 `max(10, 46 - i * 6)`. 장식 레이어 전체에 `GaussianBlur(1.5)`를 건 뒤 배경에 합성한다. 이유: 다른 회사의 그림이나 상표 없이 섬과 소리 모티브를 보여 준다.
      - 글자: 그림자를 먼저 그린다. 별도 레이어에 검정 알파 120으로 (0, 6) 아래에 같은 글자를 그리고 `GaussianBlur(10)`을 건 뒤 합성한다. 그다음 원래 위치에 글자를 그린다. 한 줄은 `(글자, 색)` 조각 목록이고, 조각을 왼쪽부터 이어 그린다(`textlength`로 다음 x를 구한다).
      - 글꼴 맞춤: 최대 크기에서 시작해, 함께 쓰는 줄 중 가장 넓은 줄이 최대 폭 안에 들어갈 때까지 2씩 줄인다. 같은 묶음의 줄은 같은 크기를 쓴다.
      - 놓기: 항목 모양대로 그림자를 먼저 그린다. 검정 알파 120의 둥근 사각형을 (0, 18) 아래에 그리고 `GaussianBlur(28)`. 그 위에 항목을 `alpha_composite`한다. 항목은 둥근 사각형 알파 마스크로 모서리를 잘라 둔다(재료 모서리의 배경색을 지운다).

      ## 1장: 팝업 합성 `store-<culture>-1.png`
      - 제목: 가운데 정렬, 위 y=70, AMBER, Black, 최대 112, 최대 폭 1700.
      - 팝업 세 개: 각 재료를 반지름 `높이 // 2`로 잘라 폭 620으로 LANCZOS 크기 조정(높이는 비율 유지). 묶음 원점 `x0 = (1920 - (430 + 620)) // 2`, `y0 = 320`. 1번은 `(x0, y0)`, 2번은 `(x0 + 430, y0 + 140)`, 3번은 `(x0 + 170, y0 + 280)`에 1, 2, 3 순서로 놓는다(뒤에 놓은 것이 위). 그림자 반지름은 팝업 높이 // 2.
      - 문구 두 줄: 가운데 정렬, y=820과 y=912, Bold, 최대 64, 최대 폭 1760, 두 줄이 같은 크기.

      ## 2장: 설정 합성 `store-<culture>-2.png`
      - 왼쪽 제목 두 줄: x=130, y=210과 y=340, AMBER, Black, 최대 100, 최대 폭 860, 같은 크기.
      - 왼쪽 기능 네 줄: x=136, y = 540 + i * 82, 흰색, Bold, 최대 46, 최대 폭 860, 같은 크기. 각 줄 앞에 `"· "`를 붙인다.
      - 설정 창: 모서리 반지름 `round(폭 * 8 / 720)`으로 자른다(창은 720 DIP 폭으로 찍히고 Windows 11 창 모서리가 8 DIP다). 배율 `min(1, 800 / 폭, 960 / 높이)`. 1보다 작을 때만 LANCZOS로 줄인다. 이유: 키우면 글자가 흐려진다. 상자 x 1040~1840, y 60~1020의 가운데에 놓는다.

      ## 문구(그대로 쓴다)
      ko-KR
      - 1장 제목: `곡이 바뀌는 순간`
      - 1장 문구 1줄: [`창을 바꾸지 않아도`(흰색)]
      - 1장 문구 2줄: [`제목·아티스트·앨범아트`(AMBER), `를 바로 확인하세요`(흰색)]
      - 2장 제목: `원하는 대로` / `맞추세요`
      - 2장 기능: `표시 시간 2~10초`, `위치 6곳, 크기 70~100%`, `밝게·어둡게 테마`, `앱별로 켜고 끄기`
      en-US
      - 1장 제목: `When the track changes`
      - 1장 문구 1줄: [`See the `(흰색), `title, artist, and album art`(AMBER)]
      - 1장 문구 2줄: [`without switching windows`(흰색)]
      - 2장 제목: `Make it` / `yours`
      - 2장 기능: `Show for 2 to 10 seconds`, `6 positions, 70% to 100% size`, `Light or dark theme`, `Turn popups on or off per app`
      문구는 언어별 딕셔너리 같은 데이터 하나에 모은다. 앱의 `.resw`에 넣지 마라. 이유: 앱 UI가 아니라 Store 이미지 문구다.

      ## 확인과 금지
      - 직접 확인: 저장소 밖 임시 폴더에 가짜 재료를 만들어 돌려 본다(예: 360x80 회색 사각형 세 장과 720x800 흰 사각형 한 장을 두 언어 이름으로 저장). 결과가 언어당 2장, 모두 1920x1080으로 생기는지, 입력 하나를 지웠을 때 종료 코드가 1인지 본다. 끝나면 임시 폴더를 지운다. 이유: 하네스가 저장소 안에서 ignore되지 않은 파일을 모두 커밋한다.
      - 이미지 파일, 글꼴 파일을 저장소에 추가하지 마라. 이유: 결과물은 Partner Center에만 올리고, 글꼴은 이 PC에 설치돼 있다.
      - `tools/smoke/`, `src/`, 문서를 고치지 마라. 이유: 스모크와 문서는 s2가 바꾼다.
      - Pillow 말고 다른 패키지를 쓰지 마라.
    expected_files:
      - tools/store/compose_screenshots.py
    ac:
      - 'uv run tools/store/compose_screenshots.py --help'
      - 'git grep --untracked -q -F -e "store-material-" -- tools/store/compose_screenshots.py'
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'

  - id: s2-capture-materials
    title: capture store screenshot materials in the smoke script
    type: feat
    scope: tools
    description: |
      먼저 읽을 파일: docs/ADR.md(ADR-009), CLAUDE.md("명령어"), docs/store-listing.md("스크린샷" 절), tools/store/compose_screenshots.py(s1에서 만든 합성 스크립트, 재료 파일 이름 계약), tools/smoke/BackdropFixture.ps1, tools/smoke/MediaFixture.ps1, tools/smoke/Smoke.ps1(특히 `SmokeNative`, `Save-ElementScreenshot`, `Save-WorkAreaScreenshot`, `Select-ComboBoxItem`, `Get-SettingsWindow`, `Get-SettingsElement`, `Start-StoreBackdrop`, `Test-PopupSize`, `Save-StoreScreenshots`, `$StoreFixtureAppId`).

      `tools/smoke/` 읽기와 수정 방법: `.codex/hooks/guard.py`는 `tools/smoke/` 경로가 읽기 전용 도구가 아닌 명령에 들어가면 앱 실행으로 보고 막는다.
      `Get-Content tools/smoke/Smoke.ps1 | Select-Object -Skip <N> -First <M>`나 `rg <패턴> tools/smoke/Smoke.ps1`처럼 읽고, 수정은 apply_patch로 한다. `(Get-Content ...)[a..b]` 형태는 막힌다.
      아래 `ac` 중 `tools/smoke/`가 들어간 명령은 하네스가 실행한다. Codex가 막혀서 못 돌려도 blocker가 아니다. 스모크 스크립트와 앱은 절대 실행하지 마라. 이유: ADR-009.

      목표: `storeshots` 시나리오가 작업 영역 전체 대신, s1 합성 스크립트가 읽는 재료 PNG를 `$OutDir`에 저장하게 한다. 문서를 새 흐름에 맞춘다.

      ## 1. `tools/smoke/BackdropFixture.ps1`
      `-Neutral`일 때의 그라데이션 비트맵을 단색 `#155488` 채우기로 바꾼다(`BackColor`로 칠해도 된다). `-Neutral`의 HWND_TOP 처리와 `-Neutral`이 없을 때의 빨강·파랑 띠는 바꾸지 마라. 이유: media 시나리오의 Acrylic 검사가 그 색에 의존한다.
      파일 첫 줄 주석과 `-Neutral` 근처 주석에, 이 색이 Store 합성 배경의 가운데 색이라 팝업 Acrylic의 색과 가장자리가 합성 배경과 어울린다고 적는다.

      ## 2. `tools/smoke/Smoke.ps1`
      - `SmokeNative`에 추가: `[DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr window, int attribute, out RECT value, int size);`
      - 새 함수 `Save-WindowFrameScreenshot($Window, [string] $Name)`: `DwmGetWindowAttribute(handle, 9 /* DWMWA_EXTENDED_FRAME_BOUNDS */, out rect, 16)`로 얻은 보이는 창 영역을 `CopyFromScreen`으로 `$OutDir/$Name.png`에 저장하고 `Write-Line "screenshot <경로>"`. 반환값이 0이 아니면 throw한다. 주석에 이유를 적는다: `GetWindowRect`와 UI Automation 경계에는 보이지 않는 크기 조절 테두리가 들어 있다.
      - `Save-WorkAreaScreenshot`은 이 변경으로 쓰이지 않게 되므로 지운다.
      - `Save-StoreScreenshots`를 아래 순서로 다시 쓴다. 맨 앞의 방해 금지 확인, 언어 처리 순서(`Stop-App`, `Invoke-LanguageOverride`, `Open-Settings`), 실제 곡 제목을 출력하지 않고 데모 제목과 정확히 같을 때만 찍는 규칙, `finally`에서 fixture·backdrop·상태 파일을 정리하는 방식은 지금 함수를 따른다.
        1. 앨범아트 세 장을 `System.Drawing`으로 만든다. 512x512, `ForwardDiagonal` 그라데이션, 경로 `$OutDir/store-album-art-<n>.png`. 1: `#76C7C0`→`#274B6D`, 2: `#F59E0B`→`#BE185D`, 3: `#A78BFA`→`#1E3A8A`. 이유: 다른 회사의 앨범아트와 상표를 쓰지 않는다. 함수 끝 `finally`에서 세 장을 지운다.
        2. 언어 데이터:
           - ko-KR: 곡 `파도 소리`, `섬의 아침`, `노을 산책`, 아티스트 `소리섬 데모`
           - en-US: 곡 `Ocean Waves`, `Island Morning`, `Sunset Walk`, 아티스트 `Soriseom Demo`
           팝업 n(1~3)의 테마: 1 `ThemeLight`, 2 `ThemeDark`, 3 `ThemeLight`. 곡 n에는 앨범아트 n을 쓴다.
        3. 언어마다: `Stop-App`, `Invoke-LanguageOverride <culture>`, `Open-Settings`. `PopupSizeSlider`를 `RangeValuePattern.SetValue(100)`으로 100%로 둔다(`Test-PopupSize` 참고). 이유: 재료 해상도를 가장 크게 한다.
           설정 창을 `SetWindowPos(handle, IntPtr.Zero, 작업 영역 왼쪽 + 40 DIP, 작업 영역 위 + 200 DIP, 0, 0, SWP_NOSIZE 0x1 | SWP_NOZORDER 0x4 | SWP_NOACTIVATE 0x10)`로 옮긴다. 이유: 팝업은 작업 영역 위쪽 가운데에 뜨고 Acrylic이라, 설정 창이 그 뒤에 있으면 팝업 색에 섞인다. DIP는 `GetDpiForSystem() / 96` 배율을 곱한다.
           `Start-StoreBackdrop`, 2초 대기(앱이 미디어 감시를 시작할 시간).
        4. 팝업 n = 1, 2, 3 차례로: `Select-ComboBoxItem 'ThemeComboBox' <테마 n>`. `MediaFixture.ps1`을 `-AppId $StoreFixtureAppId`, `-FirstTitle <곡 n>`, `-SecondTitle <곡 n>`(같은 제목), `-Artist`, `-ThumbnailPath <앨범아트 n>`, `-StatusPath`로 시작한다. 이유: 둘째 갱신이 같은 제목이면 앱이 다시 띄우지 않아, 늦게 멈춰도 다른 팝업이 생기지 않는다.
           `TitleText`가 곡 n과 정확히 같은 팝업을 12초까지 기다리고, 1.5초 뒤 여전히 곡 n인지 확인한다(지금 함수의 두 `Check`와 같은 방식, 이름에 언어와 n을 넣는다). 실패하면 그 팝업만 건너뛴다(`continue`). 통과하면 `Save-ElementScreenshot $popup "store-material-<culture>-popup-<n>"`.
           팝업 창 `GetWindowRect` 크기가 360x80 DIP에 배율을 곱한 값과 각각 2px 이내인지 `Check`한다(`Test-PopupBounds`의 크기 판정 참고, 이름에 언어와 n).
           fixture 프로세스를 멈추고 `Wait-For { -not (Get-PopupWindow) }`로 팝업이 사라지는지 `Check`한다. 사라지지 않으면 이 언어의 나머지를 건너뛴다. 이유: 다음 곡이 같은 팝업 창에 겹친다.
        5. 설정 재료: `Select-ComboBoxItem 'ThemeComboBox' 'ThemeLight'`. `Get-SettingsElement $StoreFixtureAppId`(앱 목록 행의 ToggleSwitch)를 `Wait-For`로 찾아 `Check`하고 `ScrollItemPattern`으로 보이게 한다. 설정 창을 지금 함수처럼 `HWND_TOPMOST`, 작업 영역 가운데, 폭 720 DIP, 높이 `min(1040 DIP, 작업 영역 높이 - 80 DIP)`로 옮기고 500ms 기다린다.
           그다음 창을 내용에 맞게 줄인다. 목표 아래 끝 = ToggleSwitch `BoundingRectangle.Bottom` + 41 DIP(카드 안쪽 여백 16, 테두리 1, 페이지 여백 24). DWM 보이는 영역의 아래 끝이 목표보다 크면, 그 차이만큼 `GetWindowRect` 높이를 줄여 `SetWindowPos(..., SWP_NOMOVE 0x2 | SWP_NOZORDER 0x4 | SWP_NOACTIVATE 0x10)`로 적용하고 500ms 기다린다. 이유: 고정 높이면 창 아래가 비어 보인다.
           `Save-WindowFrameScreenshot (Get-SettingsWindow) "store-material-<culture>-settings"`. 창을 못 찾으면 `Check` 실패로 처리하고 넘어간다(지금 함수처럼 null을 그대로 쓰지 않는다).
      - `.PARAMETER Scenario` 설명의 storeshots 문장을 "storeshots captures the materials for the Store screenshots and is not included in the default list."로 바꾼다.

      ## 3. 문서
      - CLAUDE.md "그 밖의 명령" 표: `Store 스크린샷 생성(Claude만)` 줄을 `Store 스크린샷 재료 촬영(Claude만)`으로 이름만 바꾸고(명령은 그대로), 바로 아래에 줄을 추가한다.
