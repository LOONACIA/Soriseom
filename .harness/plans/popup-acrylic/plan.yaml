  - id: s3-popup-edge-and-tint
    title: hide the jagged acrylic edge and let more show through
    type: fix
    scope: app
    description: |
      먼저 읽을 파일: CLAUDE.md("C# 규칙", "구조 규칙", "주의"), docs/ARCHITECTURE.md("창과 셸 연동 (App)"의 **팝업 창** 항목), `src/Soriseom.App/PopupAcrylicBackdrop.cs`,
      `src/Soriseom.App/PopupWindow.xaml`, `src/Soriseom.App/PopupWindow.xaml.cs`.

      목표: 사용자가 실제 앱에서 두 가지를 보고했다. 알약 가장자리가 계단처럼 끊겨 보이고, 어두운 화면 위에서는 Acrylic이 적용됐는지 알 수 없을 만큼 비치지 않는다. 둘 다 고친다.

      2026-11-04에 임시 WinUI 창(WindowsAppSDK 2.6.4, Windows 11, 배율 100%)에서 이 스텝과 같은 구조로 시험한 결과다. 아래 설계와 값은 이 결과에서 나왔으니 다른 방식이나 값으로 바꾸지 마라.
      - `SystemBackdropElement`의 `CornerRadius` 가장자리는 안티앨리어싱되지 않는다. 확대하면 띠 색에서 Acrylic 색으로 한 픽셀 만에 바뀐다. 요소와 조상의 Visual에 `BorderMode = Soft`를 걸어도 그대로였다.
      - 불투명한 2 DIP 테두리를 Acrylic 가장자리 위에 겹치면 계단이 가려지고 테두리의 안티앨리어싱된 바깥선이 보인다. 90%와 70% 크기, 작은 원 상태에서 모두 매끄러웠다. 테두리는 반투명이면 계단이 비쳐 보이므로 불투명해야 한다.
      - 테두리 색은 라이트 `#E0E0E0`, 다크 `#383838`일 때 어두운 배경, 흰 배경, 컬러 배경에서 가장 덜 튀었다.
      - `DesktopAcrylicController` 기본값은 라이트 Tint `#FCFCFC`, TintOpacity 0, LuminosityOpacity 0.85이고 다크 Tint `#2C2C2C`, TintOpacity 0.15, LuminosityOpacity 0.96이다.
        LuminosityOpacity를 라이트 0.70, 다크 0.80으로 낮추면 비침이 눈에 띄면서 보조 글자 대비가 시험 배경 전체에서 라이트 4.7:1, 다크 5.1:1 이상이다. 더 낮추거나 `DesktopAcrylicKind.Thin`을 쓰면 4.5:1 아래로 내려간다.
      - 값을 `OnDefaultSystemBackdropConfigurationChanged`에서 테마별로 다시 넣으면 실행 중 테마 전환에서 농도와 테두리 색이 함께 바뀌었다.
      - 폭 Storyboard를 Acrylic과 테두리를 담은 `Grid`에 걸면, 5배 느리게 돌린 프레임에서 테두리가 알약 폭을 그대로 따라갔고 내용의 clip과 Translation도 어긋나지 않았다.

      ## 1. `src/Soriseom.App/PopupAcrylicBackdrop.cs`
      파일 전체를 아래 내용으로 바꾼다. 달라지는 것은 `using Windows.UI;`, 상수와 색 필드, `OnTargetConnected`에서 컨트롤러를 먼저 만드는 순서, `CopyDisplayState`의 tint 설정이다.
      ```csharp
      using Microsoft.UI.Composition;
      using Microsoft.UI.Composition.SystemBackdrops;
      using Microsoft.UI.Xaml;
      using Microsoft.UI.Xaml.Media;
      using Windows.UI;

      namespace Soriseom.App;

      /// <summary>
      /// Desktop acrylic that stays on in an inactive window. The popup never takes focus, and DesktopAcrylicBackdrop shows a flat color when the window is inactive.
      /// </summary>
      internal sealed partial class PopupAcrylicBackdrop : SystemBackdrop
      {
          // The system's opacities (0.85 light, 0.96 dark) let almost nothing of a dark screen through.
          // Below these values secondary text drops under 4.5:1 on some backgrounds.
          private const float LightLuminosityOpacity = 0.7f;
          private const float DarkLuminosityOpacity = 0.8f;
          private const float DarkTintOpacity = 0.15f;
          private static readonly Color _lightTint = Color.FromArgb(255, 0xFC, 0xFC, 0xFC);
          private static readonly Color _darkTint = Color.FromArgb(255, 0x2C, 0x2C, 0x2C);
          private readonly SystemBackdropConfiguration _configuration = new() { IsInputActive = true };
          private DesktopAcrylicController? _controller;

          protected override void OnTargetConnected(ICompositionSupportsSystemBackdrop connectedTarget, XamlRoot xamlRoot)
          {
              base.OnTargetConnected(connectedTarget, xamlRoot);
              Microsoft.UI.Dispatching.DispatcherQueue.GetForCurrentThread().EnsureSystemDispatcherQueue();
              _controller = new DesktopAcrylicController();
              CopyDisplayState(connectedTarget, xamlRoot);
              _controller.SetSystemBackdropConfiguration(_configuration);
              _controller.AddSystemBackdropTarget(connectedTarget);
          }

          protected override void OnDefaultSystemBackdropConfigurationChanged(ICompositionSupportsSystemBackdrop target, XamlRoot xamlRoot)
          {
              CopyDisplayState(target, xamlRoot);
          }

          protected override void OnTargetDisconnected(ICompositionSupportsSystemBackdrop disconnectedTarget)
          {
              _controller?.RemoveSystemBackdropTarget(disconnectedTarget);
              _controller?.Dispose();
              _controller = null;
              base.OnTargetDisconnected(disconnectedTarget);
          }

          // Everything except IsInputActive, which the default configuration turns off for this window.
          // The tint is set by hand, so it is set again for each theme.
          private void CopyDisplayState(ICompositionSupportsSystemBackdrop target, XamlRoot xamlRoot)
          {
              var current = GetDefaultSystemBackdropConfiguration(target, xamlRoot);
              _configuration.Theme = current.Theme;
              _configuration.IsHighContrast = current.IsHighContrast;
              _configuration.HighContrastBackgroundColor = current.HighContrastBackgroundColor;
              bool isDark = current.Theme == SystemBackdropTheme.Dark;
              _controller!.TintColor = isDark ? _darkTint : _lightTint;
              _controller.TintOpacity = isDark ? DarkTintOpacity : 0;
              _controller.LuminosityOpacity = isDark ? DarkLuminosityOpacity : LightLuminosityOpacity;
          }
      }
      ```
      `OnDefaultSystemBackdropConfigurationChanged`에서 base를 부르지 마라. 이유: 지금 코드의 동작을 유지한다(`TransparentBackdrop`의 주석 참고).

      ## 2. `src/Soriseom.App/PopupWindow.xaml`
      - 루트 `<Grid Background="Transparent">`의 첫 자식으로 테두리 색을 넣는다.
        ```xml
        <Grid.Resources>
            <ResourceDictionary>
                <ResourceDictionary.ThemeDictionaries>
                    <ResourceDictionary x:Key="Default">
                        <SolidColorBrush x:Key="PopupRimBrush" Color="#FF383838" />
                    </ResourceDictionary>
                    <ResourceDictionary x:Key="Light">
                        <SolidColorBrush x:Key="PopupRimBrush" Color="#FFE0E0E0" />
                    </ResourceDictionary>
                    <ResourceDictionary x:Key="HighContrast">
                        <SolidColorBrush x:Key="PopupRimBrush" Color="{ThemeResource SystemColorWindowTextColor}" />
                    </ResourceDictionary>
                </ResourceDictionary.ThemeDictionaries>
            </ResourceDictionary>
        </Grid.Resources>
        ```
      - `Island` 안의 구조를 다음처럼 바꾼다. `ContentRow`의 자식은 고치지 마라. 이유: `tools/smoke/Smoke.ps1`이 `TitleText`로 창을 찾는다.
        ```xml
        <Grid x:Name="Island" Width="360" Height="80">
            <Grid x:Name="IslandSurface" Width="80" HorizontalAlignment="Center">
                <SystemBackdropElement x:Name="IslandBackdrop" Margin="1" CornerRadius="39" />
                <Border
                    x:Name="SolidFallback"
                    Margin="1"
                    Background="{ThemeResource SolidBackgroundFillColorBaseBrush}"
                    CornerRadius="39"
                    Visibility="Collapsed" />
                <Border
                    BorderBrush="{ThemeResource PopupRimBrush}"
                    BorderThickness="2"
                    CornerRadius="40" />
            </Grid>
            <Grid x:Name="IslandForeground">
                <Grid x:Name="ContentRow" Padding="12,12,20,12" ColumnSpacing="12">
                    <!-- 지금 ContentRow의 내용 그대로 -->
                </Grid>
            </Grid>
        </Grid>
        ```
        `IslandForeground`의 `BorderBrush`, `BorderThickness`, `CornerRadius`는 없앤다. 이유: 테두리는 이제 폭을 따라가는 `IslandSurface` 안에 있다. `ContentRow`의 Padding이 1씩 커지는 것은 없어진 1 DIP 테두리만큼 내용 위치를 유지하기 위해서다.
        `Margin="1"`과 `CornerRadius="39"`는 Acrylic 가장자리가 2 DIP 테두리의 한가운데 오게 한다.

      ## 3. `src/Soriseom.App/PopupWindow.xaml.cs`
      - 생성자: `IslandBackdrop.SizeChanged += (_, args) => FollowBackdropWidth(args.NewSize.Width);`를 `IslandSurface.SizeChanged += (_, args) => FollowSurfaceWidth(args.NewSize.Width);`로 바꾼다. `IslandBackdrop.SystemBackdrop` 설정과 `SolidFallback` 분기는 그대로 둔다.
      - 메서드 이름을 `AnimateBackdropWidth`에서 `AnimateSurfaceWidth`로, `FollowBackdropWidth`에서 `FollowSurfaceWidth`로 바꾸고 호출부도 바꾼다.
      - `AnimateSurfaceWidth` 안에서 `IslandBackdrop.Width = from;`을 `IslandSurface.Width = from;`으로, `Storyboard.SetTarget(frames, IslandBackdrop);`을 `Storyboard.SetTarget(frames, IslandSurface);`로 바꾼다.
      - `ShowTrack`과 `HidePopup`의 `IslandBackdrop.ActualWidth`를 `IslandSurface.ActualWidth`로 바꾼다.
      - `AnimateSurfaceWidth` 위의 주석을 다음으로 바꾼다.
        ```csharp
        // Composition drops a rounded clip on the acrylic and on its ancestors, so the round shape comes from the surface's own
        // size and corner radius. Its width is layout, so the clip and the content follow it to stay on the same frame.
        ```
      - 시간과 이징 값, 공개 메서드 시그니처는 그대로 둔다.

      ## 4. docs/ARCHITECTURE.md
      "창과 셸 연동 (App)"의 **팝업 창** 항목에서 다음 문장을
      `Composition의 둥근 clip은 Acrylic과 그 조상에서 무시되므로, 작은 원은 Acrylic 요소의 폭과 `CornerRadius`로 만들고 테두리와 내용의 clip이 그 폭을 따라갑니다.`
      이렇게 바꾼다.
      `기본 농도는 어두운 화면에서 거의 비치지 않아 `LuminosityOpacity`를 라이트 0.70, 다크 0.80으로 낮췄고, 값을 직접 넣으므로 테마가 바뀔 때마다 다시 넣습니다. 더 낮추면 보조 글자 대비가 4.5:1 아래로 내려갑니다. `SystemBackdropElement`의 둥근 가장자리는 안티앨리어싱되지 않아 계단처럼 보이므로, 불투명한 2 DIP 테두리를 그 위에 겹쳐 가립니다. Composition의 둥근 clip은 Acrylic과 그 조상에서 무시되므로, 작은 원은 Acrylic과 테두리를 담은 `IslandSurface`의 폭으로 만들고 내용의 clip이 그 폭을 따라갑니다.`

      ## 하지 말 것
      - `DesktopAcrylicKind.Thin`이나 위와 다른 농도를 쓰지 마라. 이유: 위 시험에서 글자 대비가 기준 아래로 내려갔고, 사용자가 이 값을 골랐다.
      - 테두리를 반투명으로 하거나 `Visual.BorderMode`, `SetWindowRgn`, `CompositionGeometricClip`을 쓰지 마라. 이유: 위 시험에서 계단을 가리지 못했거나, 이전 시험에서 Acrylic과 맞지 않았다.
      - 창을 프레임마다 옮기거나 크기를 바꾸지 마라. 창 그림자나 새 설정 항목을 넣지 마라. 이유: 이 계획 밖이다.
      - `TransparentBackdrop.cs`, `PopupController`, Core, 테스트, `tools/smoke/`를 고치지 마라. 이유: 스모크 검사는 다음 스텝에서 추가한다. NuGet 패키지를 추가하지 마라. 앱을 실행하지 마라(CLAUDE.md "주의").
    expected_files:
