  - id: s4-smoke-edge-check
    title: check in the smoke script that the popup edge is anti-aliased
    type: feat
    scope: tools
    description: |
      먼저 읽을 파일: CLAUDE.md("주의"), docs/ADR.md(ADR-009), `tools/smoke/Smoke.ps1`(`Check`, `Test-PopupAcrylic`), `tools/smoke/BackdropFixture.ps1`.

      목표: media 시나리오의 스크린샷에서 알약 왼쪽 곡선이 계단처럼 끊기는지 본다. 이유: 이전 스모크는 뒤가 비치는지만 봐서 사용자가 보고한 계단 현상을 통과시켰다.

      원리: 왼쪽 끝은 빨간 띠(255,0,0) 위에 있다. 행마다 왼쪽에서 띠와 충분히 다른 첫 픽셀을 찾아, 그 픽셀이 바로 안쪽 픽셀까지 가는 길의 일부만 왔으면 안티앨리어싱된 행으로 센다.
      2026-11-04에 스크린샷으로 잰 값이다. 계단 가장자리인 지난 Release 앱은 57행 중 0행(90%)과 45행 중 0행(70%)이었고, 테두리를 겹친 구조는 57행 중 36행(라이트 90%), 45행 중 26행(라이트 70%), 57행 중 38행(다크 90%)이었다. 기준은 그 사이인 30%다.
      띠와 16 미만으로 다른 픽셀을 건너뛰는 이유: 1~2 단계만 다른 희미한 픽셀이 계단 가장자리에도 있어 그대로 세면 계단도 통과한다.

      이 스텝의 파일은 파일 편집 도구로만 고치고 실행하지 마라. 이유: `.codex/hooks/guard.py`가 `tools/smoke/` 경로가 들어간 셸 명령을 막고, 스모크는 계획 마무리 때 Claude가 돌린다.

      ## 1. `tools/smoke/Smoke.ps1`
      - `Test-PopupAcrylic` 앞에 함수를 추가한다.
        ```powershell
        # How far a pixel is from the red half of the backdrop band.
        function Get-RedBandDistance($Pixel) {
            return [Math]::Max(255 - $Pixel.R, [Math]::Max($Pixel.G, $Pixel.B))
        }

        # The share of rows on the left curve of the pill where the step from the band takes more than one pixel.
        # The acrylic's own rounded edge is a hard stair step, so without the rim over it this is zero.
        function Get-PopupEdgeSoftness($Bitmap) {
            $rows = 0
            $softRows = 0
            for ($y = [int]($Bitmap.Height * 0.1); $y -lt [int]($Bitmap.Height * 0.9); $y++) {
                for ($x = 0; $x -lt [int]($Bitmap.Width / 4); $x++) {
                    $distance = Get-RedBandDistance $Bitmap.GetPixel($x, $y)
                    if ($distance -lt 16) { continue }

                    $settled = [Math]::Max((Get-RedBandDistance $Bitmap.GetPixel(($x + 1), $y)), (Get-RedBandDistance $Bitmap.GetPixel(($x + 2), $y)))
                    $rows++
                    if ($distance / $settled -lt 0.75) { $softRows++ }
                    break
                }
            }

            if ($rows -eq 0) { return 0 }
            return $softRows / $rows
        }
        ```
      - `Test-PopupAcrylic`의 `try` 블록에서 'the popup lets what is behind it show through' `Check` 다음 줄에 넣는다.
        ```powershell
        $softness = Get-PopupEdgeSoftness $bitmap
        Check 'the popup edge is anti-aliased' ($softness -ge 0.3) ('{0:P0} of the rows on its curve are partly covered' -f $softness)
        ```
        이 위치에 넣는 이유: 앞의 모서리 검사가 다른 창이 띠를 가린 경우를 걸러 주고, `popup.png` 하나만 보면 된다.
      다른 시나리오와 판정은 고치지 마라.

