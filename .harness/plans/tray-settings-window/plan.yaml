id: tray-settings-window
goal: >
  앱이 트레이에 상주하고 설정 창에서 팝업 설정을 바꿀 수 있게 한다. 실행하면 트레이 아이콘이 생기고 설정 창이 열린다. 트레이 아이콘
  왼쪽 클릭은 설정 창, 오른쪽 클릭은 메뉴(설정, 종료)이며, 설정 창을 닫아도 앱과 팝업은 계속 동작하고 종료는 트레이 메뉴에서만 한다.
  이미 실행 중일 때 다시 실행하면 새 프로세스는 끝나고 기존 인스턴스의 설정 창이 열린다. 설정 창에서 표시 시간(2~10초, 1초 단위),
  위치(6곳), 전체화면일 때 숨기기, 지금까지 감지된 앱별 켜기/끄기를 바꾸면 저장 버튼 없이 `ApplicationData.Current.LocalSettings`에
  저장되고 다음 팝업부터 적용되며 다시 실행해도 유지된다. 처음 보는 앱은 켜진 상태로 목록에 추가된다. 완료는 CLAUDE.md의 검사 3개
  (x64 빌드, Core 테스트, 포맷 검사)와 로컬 MSIX 생성이 통과하고, 사람이 Visual Studio에서 docs/PRD.md 4·5절의 동작을 수동으로
  확인할 수 있는 상태다. 로그인 시 자동 실행과 실행 방식에 따른 창 열기 구분, 언어 선택, 정식 트레이 아이콘, 앱 표시 이름 조회,
  Acrylic, 방해 금지 감지, CI, Release 빌드는 이 계획 밖이다.
approved: true
max_attempts: 3
ac_timeout_sec: 900
steps:
  - id: s1-tray-resident
    title: keep the app in the tray with a settings window
    type: feat
    scope: app
    description: |
      먼저 읽을 파일: CLAUDE.md("명령어"의 "주의", "구조 규칙"), docs/PRD.md("4. 설정 창", "5. 상주", "6. 현지화"),
      docs/ARCHITECTURE.md("창과 셸 연동 (App)"의 트레이, "횡단 관심사"의 에러 처리·로깅·현지화), docs/ADR.md("원칙"의 패키지
      목록, ADR-002, ADR-008), `src/Soriseom.App/App.xaml.cs`, `MainWindow.xaml`, `MainWindow.xaml.cs`, `PopupWindow.xaml.cs`
      (HWND를 얻고 CsWin32 `PInvoke`를 부르는 방식), `NativeMethods.txt`, `Soriseom.App.csproj`, `Strings/en-US/Resources.resw`,
      `Strings/ko-KR/Resources.resw`.

      목표: 앱이 트레이에 상주한다. 실행하면 트레이 아이콘이 생기고 설정 창이 열린다. 트레이 아이콘 왼쪽 클릭은 설정 창을 열고,
      오른쪽 클릭은 메뉴(설정, 종료)를 연다. 설정 창을 닫아도 앱과 곡 변경 팝업은 계속 동작하고, 종료는 트레이 메뉴에서만 한다
      (PRD 5). 이 스텝의 설정 창은 제목 글자만 있는 창이다. 다음은 이후 스텝에서 하므로 지금 넣지 마라: 단일 인스턴스(s2), 설정
      저장과 표시 시간·위치·전체화면 항목 UI(s3), 앱별 켜기/끄기 목록(s4).

      새 타입은 모두 namespace `Soriseom.App`, `src/Soriseom.App/` 바로 아래에 두고 파일 하나에 타입 하나다.

      ## 1. 패키지
      - `dotnet add src/Soriseom.App package H.NotifyIcon.WinUI --version 2.4.1`
      - `dotnet add src/Soriseom.App package CommunityToolkit.Mvvm --version 8.4.2`
      둘 다 docs/ADR.md 허용 목록(ADR-002)에 있다. 2026-10-29에 이 저장소 설정(WindowsAppSDK 2.6.4, 경고=오류, StyleCop)으로
      x64 빌드와 포맷 검사가 경고 없이 통과하는 것을 확인했고 로컬 NuGet 캐시에 있다. 버전은 `Directory.Packages.props`에
      들어가고 csproj에는 버전 없는 참조만 남는다. 이 둘 말고는 패키지를 추가하지 마라(CommunityToolkit.WinUI.*, WinUIEx 포함).
      이유: docs/ADR.md 허용 목록에 없다.

      ## 2. `SettingsWindow.xaml`, `SettingsWindow.xaml.cs`: 설정 창 (MainWindow 대체)
      `MainWindow.xaml`, `MainWindow.xaml.cs`를 지우고 `public sealed partial class SettingsWindow : Window`를 만든다. 이유: 템플릿이
      만든 빈 창을 PRD의 설정 창으로 바꾼다. csproj는 XAML 파일을 자동으로 포함하므로 csproj에 항목을 추가하지 마라.

      XAML:
      - `Window.SystemBackdrop`은 지금 MainWindow처럼 `<MicaBackdrop />`.
      - 창 내용의 루트는 `ScrollViewer`, 그 안에 `StackPanel`(Padding 24, Spacing 8). 이유: s3, s4가 이 StackPanel에 설정 항목을
        더하고, 항목이 많아지면 스크롤한다.
      - StackPanel의 첫 자식은 `x:Uid="SettingsHeader"`인 `TextBlock`(Style `{StaticResource TitleTextBlockStyle}`, Margin `0,0,0,12`).
      - XAML에 사용자에게 보이는 문자열을 직접 쓰지 마라. 이유: 문자열은 `.resw`에만 둔다(CLAUDE.md "언어").

      코드:
      - `private const int WidthDip = 560;`, `private const int HeightDip = 640;`
      - 생성자: `InitializeComponent()` 뒤에
        1. `Title = new ResourceLoader().GetString("SettingsWindowTitle");`
           (`Microsoft.Windows.ApplicationModel.Resources.ResourceLoader`). 이유: `Window`는 x:Uid를 받지 않는다.
        2. 창 크기: `var hwnd = new HWND(Win32Interop.GetWindowFromWindowId(AppWindow.Id));`,
           `uint dpi = PInvoke.GetDpiForWindow(hwnd);`, 배율은 `dpi`가 0이면 1.0, 아니면 `dpi / 96.0`.
           `AppWindow.Resize(new SizeInt32((int)Math.Round(WidthDip * scale), (int)Math.Round(HeightDip * scale)))`.
        3. `AppWindow.Closing += (sender, args) => { args.Cancel = true; sender.Hide(); };` 이유: 설정 창을 닫아도 앱은 트레이에
           남고(PRD 5) 같은 창 인스턴스를 다시 연다.
        생성자에서 창을 보이게 하지 마라.
      - `public void ShowAndActivate()`: `AppWindow.Presenter is OverlappedPresenter { State: OverlappedPresenterState.Minimized } presenter`면
        `presenter.Restore()`, 그다음 `AppWindow.Show()`와 `Activate()`. 이유: 숨겼거나 최소화한 창을 앞으로 가져온다.

      ## 3. `TrayController.cs`: 트레이 아이콘
      `internal sealed class TrayController : IDisposable`. H.NotifyIcon은 이 파일에서만 쓴다(`using H.NotifyIcon;`). 이유:
      H.NotifyIcon에는 `Window`의 확장 메서드 `Show`/`Hide`가 있고 기본값으로 프로세스 효율 모드를 켜고 끈다. 다른 파일에서
      import하면 의도하지 않은 확장 메서드가 불릴 수 있다. 창은 `AppWindow.Show()`/`AppWindow.Hide()`로만 보이고 숨긴다.
      - `public TrayController(Action openSettings, Action exit)`:
        - `var loader = new ResourceLoader();`
        - `MenuFlyout`에 `MenuFlyoutItem` 두 개를 이 순서로 넣는다: `Text = loader.GetString("TraySettings")`,
          `Command = new RelayCommand(openSettings)` / `Text = loader.GetString("TrayExit")`, `Command = new RelayCommand(exit)`
          (`CommunityToolkit.Mvvm.Input.RelayCommand`). `Click` 이벤트를 쓰지 마라. 이유: H.NotifyIcon의 기본 메뉴 모드
          (`ContextMenuMode.PopupMenu`)는 MenuFlyout을 Win32 메뉴로 바꿔 띄우면서 항목의 `Text`와 `Command`만 쓰고 `Click`은
          부르지 않는다.
        - `TaskbarIcon`을 만들어 필드에 둔다: `ToolTipText = loader.GetString("AppDisplayName")`, `NoLeftClickDelay = true`
          (이유: 더블클릭 동작이 없으므로 왼쪽 클릭을 더블클릭 대기 시간 없이 처리한다), `LeftClickCommand = new RelayCommand(openSettings)`,
          `ContextFlyout = 위 메뉴`, `IconSource = 아래 임시 아이콘`. `ContextMenuMode`, `MenuActivation`은 기본값(PopupMenu,
          RightClick) 그대로 두고 설정하지 마라.
        - 임시 아이콘: `new GeneratedIconSource { Text = "", FontFamily = new FontFamily("Segoe MDL2 Assets"), FontSize = 72,
          Foreground = new SolidColorBrush(Colors.White), Background = new SolidColorBrush(ColorHelper.FromArgb(255, 0, 103, 192)),
          BackgroundType = BackgroundType.Ellipse }` (`Microsoft.UI.Colors`, `Microsoft.UI.ColorHelper`,
          `Microsoft.UI.Xaml.Media.FontFamily`, `H.NotifyIcon.BackgroundType`). 이유: `IconSource`에 이미지 파일을 주면
          H.NotifyIcon은 ICO 형식만 읽고(PNG를 주면 `async void` 안에서 예외가 나 앱이 죽는다) 저장소에는 아직 .ico가 없다. 파란
          원에 흰 음표라 밝은·어두운 작업 표시줄 모두에서 보인다. 정식 트레이 아이콘(라이트/다크)은 PRD "출시 준비"의 아이콘
          작업에서 바꾼다. `Segoe MDL2 Assets`는 Windows 10과 11에 모두 있고 U+EC4F(음표)를 가진다(2026-10-29 확인).
        - 마지막으로 `ForceCreate(enablesEfficiencyMode: false)`를 try/catch로 감싸 부르고, 실패하면 예외를 `Debug.WriteLine`으로
          남긴다. 이유: 시각 트리에 없는 TaskbarIcon은 이 호출로 트레이에 등록된다. 인자의 기본값 true는 프로세스를 효율
          모드(EcoQoS)로 바꿔 팝업 타이머와 애니메이션을 늦출 수 있고 PRD에 없는 동작이다. 셸 API가 실패해도 앱은 끝나면 안
          된다(ARCHITECTURE "에러 처리").
      - `public void Dispose()`: TaskbarIcon의 `Dispose()`. 트레이에서 아이콘을 지운다.
      - 트레이의 마우스 이벤트와 메뉴 명령은 TaskbarIcon을 만든 스레드(UI 스레드)의 메시지 창에서 실행된다(H.NotifyIcon 2.4.1
        코드로 확인). 명령 안에서 `DispatcherQueue`로 다시 넘기지 마라.

      ## 4. `App.xaml.cs`
      - 필드: `SettingsWindow? _settingsWindow`, `TrayController? _trayController`, 기존 `PopupController? _popupController`.
        기존 `_window` 필드와 `Closed += (_, _) => Exit()`는 없앤다. 이유: 이제 설정 창을 닫아도 앱은 끝나지 않는다.
      - `OnLaunched`: `_settingsWindow = new SettingsWindow();`, `_trayController = new TrayController(ShowSettings, ExitApplication);`,
        `ShowSettings();`, 그다음 기존처럼 `PopupController`를 `DispatcherQueue.GetForCurrentThread()`로 만들어 `await StartAsync()`.
        실행하면 항상 설정 창을 연다. 이유: PRD 5 "처음 실행하면 설정 창을 엽니다". 로그인 시 자동 실행일 때 창을 열지 않는
        구분은 자동 실행 계획에서 넣는다.
      - `private void ShowSettings() => _settingsWindow?.ShowAndActivate();`
      - `private void ExitApplication()`: `_trayController?.Dispose();` 뒤 `Exit()`. 이유: 트레이 아이콘을 지우지 않고 끝내면
        마우스를 올릴 때까지 아이콘이 트레이에 남는다.
      - 기존 XML 문서 주석은 그대로 둔다.

      ## 5. 리소스와 `NativeMethods.txt`
      - `Strings/en-US/Resources.resw`와 `Strings/ko-KR/Resources.resw`에 같은 이름으로 추가한다(값은 en-US / ko-KR):
        - `SettingsWindowTitle`: `Soriseom Settings` / `소리섬 설정`
        - `SettingsHeader.Text`: `Settings` / `설정`
        - `TraySettings`: `Settings` / `설정`
        - `TrayExit`: `Exit` / `종료`
        기존 `AppDisplayName`, `AppDescription`은 고치지 마라.
      - `NativeMethods.txt`에 `GetDpiForWindow` 한 줄을 더한다. `[DllImport]`/`[LibraryImport]`로 직접 선언하지 마라(ADR-008).

      ## 하지 말 것
      - `AppInstance`(단일 인스턴스)를 쓰지 마라. 이유: s2에서 한다.
      - `ApplicationData`, 설정 항목 UI, ViewModel을 만들지 마라. 이유: s3, s4에서 한다.
      - `PopupController`, `PopupWindow`, `MediaSessionAdapter`, Core, 테스트, `Package.appxmanifest`를 고치지 마라.
      - `.ico`, `.png` 같은 아이콘 파일을 추가하지 마라. 이유: 위 임시 아이콘을 쓰고 정식 아이콘은 별도 작업이다.
      - `DISABLE_XAML_GENERATED_MAIN`이나 직접 만든 `Main`을 넣지 마라.
      - `Debug.WriteLine`은 catch 블록의 예외 기록에만 쓴다. 이유: 로그 파일과 전송은 없고 디버그 출력만 쓴다(ADR-005).
      - 앱을 실행하지 마라(`dotnet run`, 빌드된 exe 실행, 패키지 등록·설치 포함). 이유: 트레이에 상주하는 GUI라 스스로 끝나지
        않고, 패키지 앱이라 실행하면 개발용 패키지가 시스템에 등록된다. 동작 확인은 사람이 Visual Studio에서 한다.
    expected_files:
      - src/Soriseom.App/App.xaml.cs
      - src/Soriseom.App/MainWindow.xaml
      - src/Soriseom.App/MainWindow.xaml.cs
      - src/Soriseom.App/SettingsWindow.xaml
      - src/Soriseom.App/SettingsWindow.xaml.cs
      - src/Soriseom.App/TrayController.cs
      - src/Soriseom.App/NativeMethods.txt
      - src/Soriseom.App/Soriseom.App.csproj
      - src/Soriseom.App/Strings/en-US/Resources.resw
      - src/Soriseom.App/Strings/ko-KR/Resources.resw
      - Directory.Packages.props
    ac:
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'

  - id: s2-single-instance
    title: hand a second launch to the running instance
    type: feat
    scope: app
    description: |
      먼저 읽을 파일: docs/PRD.md("5. 상주"), docs/ARCHITECTURE.md("창과 셸 연동 (App)"의 단일 인스턴스), docs/ADR.md(ADR-003,
      ADR-008), s1이 만든 `src/Soriseom.App/App.xaml.cs`, `SettingsWindow.xaml.cs`(`ShowAndActivate`), `NativeMethods.txt`.

      목표: 이미 실행 중일 때 앱을 다시 실행하면 새 프로세스는 트레이 아이콘, 설정 창, 팝업을 만들지 않고 끝나며, 기존 인스턴스가
      설정 창을 앞으로 가져온다(PRD 5).

      ## 1. `App.xaml.cs`의 `OnLaunched` 맨 앞
      `using Microsoft.Windows.AppLifecycle;`의 `AppInstance`를 쓴다. `Windows.ApplicationModel.AppInstance`가 아니다.
      1. `var mainInstance = AppInstance.FindOrRegisterForKey(MainInstanceKey);` (`private const string MainInstanceKey = "main";`)
      2. `!mainInstance.IsCurrent`면:
         - `PInvoke.AllowSetForegroundWindow(mainInstance.ProcessId);` 반환값은 무시한다. 이유: 사용자가 방금 실행한 이 프로세스에는
           포그라운드 권한이 있다. 기존 인스턴스에 넘겨주지 않으면 그쪽의 `Activate()`가 창을 앞으로 가져오지 못하고 작업
           표시줄 단추만 깜박일 수 있다.
         - `await mainInstance.RedirectActivationToAsync(AppInstance.GetCurrent().GetActivatedEventArgs());`
         - `Process.GetCurrentProcess().Kill();` 후 `return`. 이유: Microsoft 문서의 WinUI 단일 인스턴스 예제(OnLaunched에서
           리디렉션)와 같은 방식이다. 이 시점에는 창도 트레이 아이콘도 없어 정리할 것이 없다.
      3. 기존 인스턴스(`IsCurrent`)면 `var dispatcherQueue = DispatcherQueue.GetForCurrentThread();`를 받아
         `mainInstance.Activated += (_, _) => dispatcherQueue.TryEnqueue(ShowSettings);`를 구독한 뒤, s1의 흐름(설정 창, 트레이,
         설정 창 열기, PopupController 시작)을 그대로 이어간다. PopupController 생성에도 같은 `dispatcherQueue`를 넘긴다.
         이유: `Activated`는 백그라운드 스레드에서 오고 창은 UI 스레드에서만 다룬다.
      - 활성화 인자의 종류(`Kind`)나 인수로 분기하지 마라. 이유: 두 번째 실행은 모두 설정 창 열기로 처리한다.
      - `RedirectActivationToAsync`를 try/catch로 감싸지 마라. 이유: 실패하면 두 번째 프로세스가 끝날 뿐이고 기존 인스턴스는
        영향을 받지 않는다.

      ## 2. `NativeMethods.txt`
      `AllowSetForegroundWindow` 한 줄을 더한다. 직접 선언하지 마라(ADR-008).

      ## 하지 말 것
      - `DISABLE_XAML_GENERATED_MAIN`과 직접 만든 `Program.Main`을 쓰지 마라. 이유: OnLaunched에서 리디렉션하면 생성된 Main을
        그대로 쓸 수 있다.
      - Mutex, 이름 있는 파이프, `FindWindow`로 단일 인스턴스를 구현하지 마라. 이유: ARCHITECTURE가 Windows App SDK의
        `AppInstance`로 정했다.
      - `Package.appxmanifest`를 고치지 마라(`SupportsMultipleInstances` 포함).
      - `SettingsWindow`, `TrayController`, `PopupController`, Core, 테스트를 고치지 마라.
      - 앱을 실행하지 마라(`dotnet run`, exe 실행, 패키지 등록 포함). 이유: 스스로 끝나지 않는 GUI이고, 실행하면 개발용
        패키지가 시스템에 등록된다.
    expected_files:
      - src/Soriseom.App/App.xaml.cs
      - src/Soriseom.App/NativeMethods.txt
    ac:
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'

  - id: s3-display-settings
    title: save display settings and apply them immediately
    type: feat
    scope: app
    description: |
      먼저 읽을 파일: CLAUDE.md("구조 규칙"), docs/PRD.md("4. 설정 창"), docs/ARCHITECTURE.md("레이어 규칙"의 ViewModel·설정 저장,
      "횡단 관심사"의 에러 처리·설정 저장·현지화), docs/ADR.md(ADR-002, ADR-004), `src/Soriseom.Core/AppSettings.cs`,
      `PopupPosition.cs`, `src/Soriseom.App/PopupController.cs`, s1·s2가 만든 `App.xaml.cs`, `SettingsWindow.xaml`,
      `SettingsWindow.xaml.cs`, `Strings/en-US/Resources.resw`, `Strings/ko-KR/Resources.resw`.

      목표: 설정 창에서 표시 시간(2~10초, 1초 단위), 위치(6곳), 전체화면일 때 숨기기를 바꿀 수 있다. 바꾼 값은 저장 버튼 없이
      바로 `ApplicationData.Current.LocalSettings`에 저장되고 다음 팝업 판단부터 적용되며, 다시 실행해도 유지된다(PRD 4).
      앱별 켜기/끄기 목록은 s4에서 하므로 넣지 마라. 언어와 로그인 시 자동 실행은 이 계획 밖이므로 UI도 저장도 넣지 마라.
      이유: 언어 전환 방식과 StartupTask 상태 연동을 그 계획에서 정한다.

      새 타입은 모두 namespace `Soriseom.App`, `src/Soriseom.App/` 바로 아래에 두고 파일 하나에 타입 하나다.

      ## 1. `SettingsStore.cs`: 설정 저장
      `internal sealed class SettingsStore`. LocalSettings를 다루는 유일한 곳이고, 저장 키 이름 상수도 여기에만 둔다(ARCHITECTURE
      "설정 저장"). UI 스레드에서만 쓴다. `ApplicationData`는 `Windows.Storage.ApplicationData`다.
      `Microsoft.Windows.Storage.ApplicationData`를 쓰지 마라. 이유: ARCHITECTURE가 `ApplicationData.Current.LocalSettings`로 정했다.
      - 키: `private const string DisplaySecondsKey = "DisplaySeconds";`, `PositionKey = "Position"`,
        `HideWhenFullscreenKey = "HideWhenFullscreen"`.
      - `public SettingsStore()`: 저장된 값을 불러와 `Current`에 둔다.
      - `public AppSettings Current { get; private set; }`
      - `public void Update(AppSettings settings)`: `settings == Current`(record 값 비교)면 아무것도 하지 않는다. 아니면
        `Current = settings`로 바꾼 뒤 저장한다.
      - 불러오기: `ApplicationData.Current.LocalSettings.Values`에서 `TryGetValue`로 읽고, 타입이 맞을 때만 `new AppSettings()`에
        `with`로 덮어쓴다. `DisplaySeconds`는 `int`(범위 보정은 `AppSettings`의 init이 하므로 App에서 다시 clamp하지 마라),
        `Position`은 enum 이름 `string`을 `Enum.TryParse(text, out PopupPosition position)`로 읽고 `Enum.IsDefined(position)`일
        때만, `HideWhenFullscreen`은 `bool`. 키가 없거나 타입이 다르면 그 항목은 기본값이다.
      - 저장: 세 값을 `Values[key]`에 쓴다. `Position`은 `ToString()` 이름으로 쓴다. 이유: 정수로 쓰면 enum 순서가 바뀔 때
        저장값의 뜻이 바뀐다.
      - 불러오기와 저장은 각각 try/catch로 감싸 예외를 `Debug.WriteLine`으로 남긴다. 불러오기가 실패하면 기본값, 저장이
        실패하면 메모리의 `Current`를 그대로 쓴다. 이유: 설정 저장 실패로 앱이 끝나면 안 된다(ARCHITECTURE "에러 처리").
      - `Language`, `LaunchAtStartup`, `Apps`는 저장하지 마라. 이유: 앞의 둘은 이 계획 밖이고 `Apps`는 s4에서 한다.
      - 변경 이벤트를 만들지 마라. 이유: 이 스텝에는 듣는 곳이 없다. s4에서 필요할 때 추가한다.

      ## 2. `SettingsViewModel.cs`
      `public sealed partial class SettingsViewModel : ObservableObject`(`CommunityToolkit.Mvvm.ComponentModel`).
      `INotifyPropertyChanged`를 직접 구현하지 마라(CLAUDE.md "구조 규칙").
      - 생성자는 `internal SettingsViewModel(SettingsStore store)`. 이유: 클래스는 `SettingsWindow`의 public 속성 타입이라
        public이어야 하고, internal인 `SettingsStore`를 받는 생성자가 public이면 CS0051이 난다.
      - `public int MinDisplaySeconds => AppSettings.MinDisplaySeconds;`, `public int MaxDisplaySeconds => AppSettings.MaxDisplaySeconds;`
        이유: 허용 범위는 Core 설정 모델에만 둔다. XAML에 2, 10을 쓰지 마라.
      - `[ObservableProperty] public partial double DisplaySeconds { get; set; }` (Slider.Value가 double이다)
      - `[ObservableProperty] public partial int PositionIndex { get; set; }` (`(int)PopupPosition`, ComboBox.SelectedIndex용)
      - `[ObservableProperty] public partial bool HideWhenFullscreen { get; set; }`
      - `[ObservableProperty]`는 반드시 partial 속성에 붙인다. 필드(`private int _x;`)에 붙이면 MVVMTK0045(WinRT AOT 비호환)
        경고가 나고 경고는 오류로 처리된다(2026-10-29 확인).
      - 생성자: `_store`에 저장한 뒤 세 속성을 `store.Current`에서 채운다. 이때도 아래 변경 메서드가 불리지만 값이 같아
        `Update`가 아무것도 하지 않는다. 초기화 중임을 나타내는 플래그를 두지 마라.
      - `partial void OnDisplaySecondsChanged(double value)`: `_store.Update(_store.Current with { DisplaySeconds = (int)Math.Round(value) })`.
      - `partial void OnPositionIndexChanged(int value)`: `(PopupPosition)value`가 `Enum.IsDefined`일 때만 `Position`을 갱신한다.
        이유: ComboBox는 선택이 없을 때 -1을 준다.
      - `partial void OnHideWhenFullscreenChanged(bool value)`: 같은 방식으로 `HideWhenFullscreen`을 갱신한다.

      ## 3. `SettingsWindow`
      - 생성자를 `internal SettingsWindow(SettingsStore store)`로 바꾸고 `InitializeComponent()`보다 먼저
        `ViewModel = new SettingsViewModel(store);`를 둔다. 속성은 `public SettingsViewModel ViewModel { get; }`.
        s1의 크기 조정, 닫기 처리, `ShowAndActivate`는 그대로 둔다.
      - XAML: `StackPanel.Resources`에 `x:Key="SettingsCardStyle"`인 `Border` 스타일을 둔다: Background
        `{ThemeResource CardBackgroundFillColorDefaultBrush}`, BorderBrush `{ThemeResource CardStrokeColorDefaultBrush}`,
        BorderThickness 1, CornerRadius `{ThemeResource ControlCornerRadius}`, Padding 16. 키 없는 암시적 스타일로 만들지 마라.
        이유: s4의 목록 항목도 이 키로 같은 카드를 쓰고, 암시적 스타일은 다른 Border까지 바꾼다.
      - `SettingsHeader` 아래에 이 스타일의 카드 세 개를 이 순서로 두고, 각 카드에 컨트롤 하나를 넣는다. 레이블은 각 컨트롤의
        `Header`를 x:Uid로 단다. 이유: 별도 TextBlock보다 단순하고 화면 읽기 프로그램에 컨트롤 이름이 전달된다.
        1. `Slider` `x:Uid="DisplaySecondsSlider"`: `Minimum="{x:Bind ViewModel.MinDisplaySeconds}"`,
           `Maximum="{x:Bind ViewModel.MaxDisplaySeconds}"`, `StepFrequency="1"`, `TickFrequency="1"`, `TickPlacement="Outside"`,
           `SnapsTo="StepValues"`, `Value="{x:Bind ViewModel.DisplaySeconds, Mode=TwoWay}"`.
        2. `ComboBox` `x:Uid="PositionComboBox"`: `SelectedIndex="{x:Bind ViewModel.PositionIndex, Mode=TwoWay}"`. 안에
           `ComboBoxItem` 여섯 개를 `PopupPosition` enum 순서(TopLeft, TopCenter, TopRight, BottomLeft, BottomCenter,
           BottomRight)대로 두고 x:Uid는 `PositionTopLeft`, `PositionTopCenter`, `PositionTopRight`, `PositionBottomLeft`,
           `PositionBottomCenter`, `PositionBottomRight`. 이유: SelectedIndex를 enum 정수값으로 바로 쓰므로 순서가 enum과
           같아야 한다. `ItemsSource`나 변환기를 쓰지 마라.
        3. `ToggleSwitch` `x:Uid="HideWhenFullscreenToggle"`: `IsOn="{x:Bind ViewModel.HideWhenFullscreen, Mode=TwoWay}"`.
      - 바인딩은 `x:Bind`만 쓴다. `{Binding}`을 쓰지 마라(CLAUDE.md).
      - 리소스(두 `.resw`에 같은 이름으로, 값은 en-US / ko-KR):
        - `DisplaySecondsSlider.Header`: `Display time (seconds)` / `표시 시간(초)`
        - `PositionComboBox.Header`: `Position` / `위치`
        - `PositionTopLeft.Content`: `Top left` / `위쪽 왼쪽`
        - `PositionTopCenter.Content`: `Top center` / `위쪽 가운데`
        - `PositionTopRight.Content`: `Top right` / `위쪽 오른쪽`
        - `PositionBottomLeft.Content`: `Bottom left` / `아래쪽 왼쪽`
        - `PositionBottomCenter.Content`: `Bottom center` / `아래쪽 가운데`
        - `PositionBottomRight.Content`: `Bottom right` / `아래쪽 오른쪽`
        - `HideWhenFullscreenToggle.Header`: `Hide while an app is full screen` / `전체화면일 때 숨기기`

      ## 4. `PopupController.cs`
      - 생성자를 `public PopupController(DispatcherQueue dispatcherQueue, SettingsStore store)`로 바꾸고, `_settings` 필드를
        없애고 `_store` 필드를 둔다.
      - `Evaluate()` 맨 앞에서 `var settings = _store.Current;`를 한 번 읽고, 그 호출 안의 `Decide`, `ShowTrack`의 위치,
        숨김 타이머 `Interval`에 모두 이 값을 쓴다. 이유: 바꾼 설정이 다음 판단부터 바로 적용된다(PRD 4).
      - 그 밖의 흐름(재평가 타이머, 썸네일 갱신, 전체화면 조회)은 바꾸지 마라.

      ## 5. `App.xaml.cs`
      기존 인스턴스 쪽 흐름에서 `var store = new SettingsStore();`를 먼저 만들고, 같은 인스턴스를 `new SettingsWindow(store)`와
      `new PopupController(dispatcherQueue, store)`에 넘긴다. 단일 인스턴스 확인(s2)보다 앞에 두지 마라. 이유: 리디렉션하고
      끝나는 두 번째 프로세스는 설정을 읽을 필요가 없다.

      ## 하지 말 것
      - Core와 테스트를 고치지 마라. 이유: 기본값과 허용 범위는 이미 `AppSettings`에 있고 테스트돼 있다.
      - 앱 목록, `WithAppSeen` 호출, `ApplicationDataContainer`를 넣지 마라. 이유: s4에서 한다.
      - 저장 버튼, 되돌리기, 기본값 복원, 재시작 안내를 넣지 마라. 이유: PRD에 없다.
      - 패키지를 추가하지 마라. `Debug.WriteLine`은 catch 블록의 예외 기록에만 쓴다.
      - 앱을 실행하지 마라(`dotnet run`, exe 실행, 패키지 등록 포함). 이유: 스스로 끝나지 않는 GUI이고, 실행하면 개발용
        패키지가 시스템에 등록된다.
    expected_files:
      - src/Soriseom.App/SettingsStore.cs
      - src/Soriseom.App/SettingsViewModel.cs
      - src/Soriseom.App/SettingsWindow.xaml
      - src/Soriseom.App/SettingsWindow.xaml.cs
      - src/Soriseom.App/PopupController.cs
      - src/Soriseom.App/App.xaml.cs
      - src/Soriseom.App/Strings/en-US/Resources.resw
      - src/Soriseom.App/Strings/ko-KR/Resources.resw
    ac:
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'

  - id: s4-app-toggles
    title: list detected apps and let the user turn them off
    type: feat
    scope: app
    description: |
      먼저 읽을 파일: docs/PRD.md("3. 표시하지 않는 경우"의 첫 항목, "4. 설정 창"), docs/ARCHITECTURE.md("레이어 규칙",
      "횡단 관심사"의 설정 저장), `src/Soriseom.Core/AppSettings.cs`, `src/Soriseom.Core/PopupDecider.cs`(`IsAppEnabled`로 끈 앱을
      거른다), `tests/Soriseom.Core.Tests/AppSettingsTests.cs`, `src/Soriseom.App/MediaSessionAdapter.cs`(`MediaSnapshot.AppId`는
      `SourceAppUserModelId`), s3가 만든 `SettingsStore.cs`, `SettingsViewModel.cs`, `SettingsWindow.xaml`, `PopupController.cs`.

      목표: 현재 미디어 세션의 앱(AppId)을 처음 보면 켜진 상태로 설정에 추가하고 저장한다. 설정 창에 지금까지 감지된 앱이 앱마다
      켜기/끄기 스위치로 나오고, 끈 앱의 곡 변경은 팝업으로 띄우지 않는다(PRD 3, 4). 끈 앱을 거르는 판단은 이미 Core
      `PopupDecider`에 있다. 설정 창이 열려 있는 동안 새 앱이 감지되면 목록에 바로 나타난다.

      새 App 타입은 namespace `Soriseom.App`, `src/Soriseom.App/` 바로 아래에 두고 파일 하나에 타입 하나다.

      ## 1. Core: `AppSettings.WithAppSeen`
      `appId`가 `string.IsNullOrWhiteSpace`면 `this`를 그대로 돌려준다. 이유: GSMTC가 빈 AppUserModelId를 줄 수 있고, 빈 이름은
      목록에서 알아볼 수 없는 항목이 되며 LocalSettings 키로 쓸 수 없다. 그 밖의 동작은 바꾸지 마라.
      테스트: `tests/Soriseom.Core.Tests/AppSettingsTests.cs`에 `[Theory]` `WithAppSeenIgnoresBlankAppId(string appId)`를 추가한다.
      `[InlineData("")]`, `[InlineData(" ")]`, `[InlineData("\t")]`. 결과가 원본과 `Assert.Same`이고 결과의 `Apps`가 비어 있음을
      검증한다. 기존 테스트는 고치지 마라.

      ## 2. `SettingsStore`
      - `private const string AppsContainerName = "Apps";`
      - 불러오기: `LocalSettings.CreateContainer(AppsContainerName, ApplicationDataCreateDisposition.Always)`의 `Values` 중 값이
        `bool`인 항목만 키(AppId)와 함께 `Apps`에 넣는다. `ImmutableDictionary<string, bool>.Empty`에서 시작해 기본 비교자
        (ordinal)를 쓴다. 이유: `AppSettings`의 기본 `Apps`와 같은 비교 규칙이다.
      - 저장: 기존 세 값과 함께 `Apps`의 모든 항목을 그 컨테이너의 `Values[appId] = enabled`로 쓴다. 컨테이너의 키를 지우지
        마라. 이유: 감지된 앱은 목록에서 빠지지 않는다.
      - `public event EventHandler? Changed;`를 추가한다. `Update`가 `Current`를 바꿨으면 저장 성공 여부와 상관없이 마지막에
        발생시킨다. 값이 같아 아무것도 하지 않았으면 발생시키지 않는다.

      ## 3. `PopupController.Evaluate`
      `var settings = _store.Current;`를 읽기 전에, `_adapter.Current is { } snapshot`이면
      `_store.Update(_store.Current.WithAppSeen(snapshot.AppId));`를 부른다. 이미 있는 앱이면 `WithAppSeen`이 같은 인스턴스를
      돌려주므로 저장하지 않는다. 이유: 처음 보는 앱은 켜진 상태로 목록에 추가된다(PRD 3). 그 밖의 흐름은 바꾸지 마라.

      ## 4. `AppToggleViewModel.cs`
      `public sealed partial class AppToggleViewModel : ObservableObject`.
      - `internal AppToggleViewModel(string appId, bool isEnabled, Action<string, bool> enabledChanged)`: 콜백 필드를 먼저
        저장한 뒤 `AppId`, `IsEnabled`를 채운다. 이유: `IsEnabled`를 채울 때 아래 변경 메서드가 불린다.
      - `public string AppId { get; }`
      - `[ObservableProperty] public partial bool IsEnabled { get; set; }` (partial 속성. 필드에 붙이면 MVVMTK0045가 오류가 된다)
      - `partial void OnIsEnabledChanged(bool value)`: 콜백에 `(AppId, value)`를 넘긴다.

      ## 5. `SettingsViewModel`
      - `public ObservableCollection<AppToggleViewModel> Apps { get; } = [];`
      - 생성자: `store.Current.Apps`를 AppId 기준 `StringComparer.OrdinalIgnoreCase` 순으로 정렬해 채우고, `store.Changed`를
        구독한다.
      - `Changed` 처리: `_store.Current.Apps` 중 컬렉션에 같은 AppId(ordinal 비교)가 없는 항목만, 정렬 순서가 유지되는 위치에
        `Insert`한다. 이미 있는 항목은 다시 만들거나 지우지 마라. 이유: 열려 있는 창의 스위치와 스크롤 위치를 유지한다.
        컬렉션을 `Clear()`하고 다시 채우지 마라.
      - 항목 콜백: `_store.Update(_store.Current with { Apps = _store.Current.Apps.SetItem(appId, enabled) })`.
      - `Changed` 구독을 해제하는 코드를 넣지 마라. 이유: 설정 창은 닫아도 숨기기만 하므로 ViewModel은 앱이 끝날 때까지 산다.

      ## 6. `SettingsWindow.xaml`
      기존 카드 세 개 아래에 이 순서로 둔다.
      - `TextBlock` `x:Uid="AppsHeader"`: Style `{StaticResource BodyStrongTextBlockStyle}`, Margin `0,16,0,0`.
      - `TextBlock` `x:Uid="AppsDescription"`: Style `{StaticResource CaptionTextBlockStyle}`, Foreground
        `{ThemeResource TextFillColorSecondaryBrush}`, `TextWrapping="Wrap"`. 이유: 감지된 앱이 없을 때도 이 설명이 목록의 뜻을
        알려 주므로 빈 상태 표시를 따로 만들지 않는다.
      - `ItemsRepeater`: `ItemsSource="{x:Bind ViewModel.Apps}"`, `<ItemsRepeater.Layout><StackLayout Spacing="8" /></ItemsRepeater.Layout>`.
        ItemTemplate은 `DataTemplate x:DataType="local:AppToggleViewModel"`(Window에 `xmlns:local="using:Soriseom.App"`)이고,
        s3의 `SettingsCardStyle` 카드 안에 `ToggleSwitch` `Header="{x:Bind AppId}"`, `IsOn="{x:Bind IsEnabled, Mode=TwoWay}"`.
        `ListView`를 쓰지 마라. 이유: 선택 상태가 필요 없고 바깥 ScrollViewer와 스크롤이 겹친다.
      - 앱 이름은 AppId를 그대로 보인다. `AppInfo.GetFromAppUserModelId`나 셸 API로 표시 이름을 조회하지 마라. 이유: 이 계획 밖이다.
      - 리소스(두 `.resw`에 같은 이름으로, 값은 en-US / ko-KR):
        - `AppsHeader.Text`: `Apps` / `앱`
        - `AppsDescription.Text`: `Apps that have played media appear here. Track changes from apps that are turned off aren't shown.`
          / `미디어를 재생한 앱이 여기에 나타납니다. 끈 앱의 곡 변경은 표시하지 않습니다.`

      ## 하지 말 것
      - 앱 삭제, 모두 켜기/끄기, 검색을 넣지 마라. 이유: PRD에 없다.
      - `PopupDecider`와 그 테스트를 고치지 마라. 이유: 끈 앱을 거르는 판단은 이미 있고 테스트돼 있다.
      - 패키지를 추가하지 마라. `Debug.WriteLine`은 catch 블록의 예외 기록에만 쓴다.
      - 앱을 실행하지 마라(`dotnet run`, exe 실행, 패키지 등록 포함). 이유: 스스로 끝나지 않는 GUI이고, 실행하면 개발용
