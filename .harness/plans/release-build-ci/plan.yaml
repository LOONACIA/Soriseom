id: release-build-ci
goal: >
  Release 구성이 빌드되고 패키징되며(트리밍 유지, IL2104만 오류에서 제외), 스모크 스크립트로 Release 빌드를 실행해 검사할 수 있고, GitHub Actions가 브랜치
  push와 PR마다 빌드, 테스트, 포맷 검사, x64 Release MSIX 생성을 돌린다. 완료는 CLAUDE.md의 검사 3개, Release 솔루션 빌드, Release MSIX 생성, 워크플로
  actionlint 검사가 통과하는 상태다. Store 제출(ADR-007의 태그 워크플로), 패키지 서명, ARM64와 x86의 CI 빌드, 패키지 크기 줄이기는 이 계획 밖이다.
approved: true
max_attempts: 3
ac_timeout_sec: 900
steps:
  - id: s1-release-build
    title: keep trimming and allow il2104 in release builds
    type: fix
    scope: build
    description: |
      먼저 읽을 파일: CLAUDE.md ("명령어", "C# 규칙"), docs/ADR.md (ADR-006, ADR-009), docs/ARCHITECTURE.md ("횡단 관심사", "구현 전에 확인할 것"),
      Directory.Build.props, src/Soriseom.App/Soriseom.App.csproj ("Publish Properties" 그룹).

      배경: Release 빌드는 지금 실패한다. App 템플릿이 Release에서 `PublishTrimmed`를 켜고, 트리머가 `Microsoft.Windows.SDK.NET`과 `WinRT.Runtime`에 대해
      내는 어셈블리 단위 경고 IL2104가 `TreatWarningsAsErrors` 때문에 오류가 되기 때문이다. 사용자는 트리밍을 유지하고 IL2104만 오류에서 빼기로 결정했다.

      할 일:

      1. Directory.Build.props의 `WarningsNotAsErrors` 값 끝에 `;IL2104`를 더한다. 바로 위에 영어 XML 주석 한 줄로 이유를 적는다: Windows SDK projection과
         WinRT.Runtime이 트리밍 안전성을 보장하지 않지만 패키지 크기 때문에 받아들인다는 내용과 `docs/ADR.md` ADR-010 참조.

      2. docs/ADR.md 맨 끝(ADR-009 뒤)에 아래 ADR을 추가한다. 내용을 바꾸지 말고 기존 ADR 형식대로 넣는다.

         ### ADR-010: Release는 트리밍을 유지하고 IL2104만 오류에서 뺀다

         - **상태**: 채택(2026-11-04, 사용자 결정)
         - **결정**: App 템플릿대로 Release에서 `PublishTrimmed`를 켜 둡니다. `Directory.Build.props`의 `WarningsNotAsErrors`에 IL2104를 더하고, 다른 트리밍 경고는 오류로 둡니다.
         - **이유**: 2026-11-04에 x64 패키지를 만들어 비교했습니다. 트리밍을 켜면 번들 32MB, 설치 크기 75MB이고, 끄면 81MB, 217MB입니다. 트리밍한 Release 빌드는 `tools/smoke/Smoke.ps1`의 31개 항목을 모두 통과했습니다. 문제가 생기면 `PublishTrimmed` 한 줄로 끌 수 있습니다.
         - **트레이드오프**: `Microsoft.Windows.SDK.NET`과 `WinRT.Runtime`은 트리밍에 안전하다는 보장이 없어서, 제거된 코드가 필요한 경로는 실행 중에 깨질 수 있습니다. IL2104는 어셈블리 단위 경고라 다른 어셈블리에서 나와도 빌드를 막지 못합니다. 2026-11-04 기준으로 이 경고를 내는 어셈블리는 위 두 개뿐이고, 늘어났는지는 Release 빌드 출력에서 봅니다.
         - **스모크가 못 보는 경로(출시 전 사람이 확인)**: 실제 앨범아트 로드(테스트 곡에는 썸네일이 없음), 트레이 오른쪽 클릭 메뉴와 종료, Windows 모드 전환.
         - **하네스에 미치는 영향**: IL2104 말고 다른 트리밍 경고를 `WarningsNotAsErrors`에 더하지 마세요. Release 전용 코드 분기를 넣지 마세요.

      3. docs/ADR.md ADR-006의 `TreatWarningsAsErrors` 항목을 다음으로 바꾼다:
         `TreatWarningsAsErrors`. NuGet 취약점 감사 경고 NU1901~NU1904와 트리밍 경고 IL2104(ADR-010)는 경고로 남깁니다.

      4. docs/ARCHITECTURE.md를 고친다.
         - "품질 게이트"의 `TreatWarningsAsErrors`(NU1901~NU1904 제외)를 `TreatWarningsAsErrors`(NU1901~NU1904, IL2104 제외)로 바꾼다.
         - "구현 전에 확인할 것"의 Release 항목 전체를 다음 한 줄로 바꾼다:
           `- [x] Release 빌드와 패키징: 트리밍을 유지하고 IL2104만 오류에서 뺍니다(ADR-010).`

      5. CLAUDE.md를 고친다.
         - "C# 규칙"의 경고 항목을 다음으로 바꾼다: `경고는 오류로 처리합니다. 예외는 NuGet 취약점 감사 경고(NU1901~NU1904)와 트리밍 경고 IL2104(ADR-010)뿐입니다.`
         - "그 밖의 명령" 표의 `로컬 MSIX 생성` 줄 앞에 두 줄을 추가한다.
           | Release 빌드 | `dotnet build Soriseom.slnx -p:Platform=x64 -c Release` |
           | Release MSIX 생성(서명 없음) | `dotnet build src/Soriseom.App -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false` |
         - "주의"에서 "Release 빌드는 아직 실패합니다."로 시작하는 줄을 다음으로 바꾼다:
           - Release 빌드는 트리밍을 켠 채 만들며 IL2104 경고가 남습니다(ADR-010). 이 PC의 MSIX 생성에서는 `mspdbcmf.exe`를 찾지 못했다는 경고도 나오는데, 기호 패키지만 빠지고 빌드는 성공합니다.

      `PublishTrimmed`와 `PublishReadyToRun` 설정을 바꾸지 마라. 이유: 트리밍을 유지하기로 결정했다. `ILLinkTreatWarningsAsErrors`나 `TrimmerSingleWarn`,
      `TreatWarningsAsErrors` 자체도 바꾸지 마라. 이유: IL2104 외의 경고는 계속 오류여야 한다.

      `#pragma`나 `[SuppressMessage]`, 앱 코드 변경, 새 패키지가 필요하면 멈추고 `blockers`에 적어라. 이유: 2026-11-04에 같은 값을 환경 변수로 넣어 코드 변경 없이 빌드가 통과하는 것을 확인했다.
      앱을 실행하지 마라. 이유: ADR-009.
    expected_files:
      - Directory.Build.props
      - docs/ADR.md
      - docs/ARCHITECTURE.md
      - CLAUDE.md
    ac:
      - 'dotnet build Soriseom.slnx -p:Platform=x64 -c Release'
      - 'dotnet build src/Soriseom.App -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false'
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'
  - id: s2-smoke-release
    title: run the smoke script against a release build
    type: feat
    scope: tools
    description: |
      먼저 읽을 파일: tools/smoke/Smoke.ps1 (`param` 블록, 주석 도움말, `Build-Msix`, `Deploy-Package`), docs/ADR.md (ADR-009, ADR-010), CLAUDE.md ("그 밖의 명령", "주의").

      배경: 트리밍은 Release에서만 일어나고 사용자가 받는 것도 Release인데, 스모크 스크립트는 Debug만 빌드한다. 이 스텝은 `-Configuration Release`로 Release 빌드를 검사할 수 있게 한다.
      스크립트는 패키지 내용을 Debug 경로의 AppX 폴더에 복사해 등록하므로 그 경로(`$AppxDir`)는 구성과 상관없이 그대로 둔다.

      tools/smoke/Smoke.ps1을 고친다.

      - `param` 블록의 `$Scenario` 다음에 `[ValidateSet('Debug', 'Release')] [string] $Configuration = 'Debug'`를 추가한다.
      - 주석 도움말에 `.PARAMETER Configuration` 절을 `.PARAMETER Scenario` 다음에 추가한다. 영어로, Debug가 기본이고 Release는 사용자가 받는 트리밍된 빌드이며, 실행이 끝나도 개발 패키지는 이 빌드로 등록된 채 남는다는 내용을 적는다.
      - `Build-Msix`를 고친다.
        - `dotnet build` 명령에 `-c $Configuration`과 `-p:AppxBundle=Never`를 추가한다. 이유: Release 기본값은 `.msixbundle`만 만들어서 `*.msix` 검색에 잡히지 않는다.
        - `dotnet build` 앞에서 `$AppProject`의 `AppPackages` 폴더를 지운다(`Remove-Item ... -Recurse -Force -ErrorAction SilentlyContinue`). 영어 주석 한 줄로 이유를 적는다. 이유: 스크립트는 가장 최근 `.msix`를 고르는데, 빌드가 패키징을 건너뛰면 다른 구성의 오래된 패키지가 잡힐 수 있다.
      - `$AppxDir`, `Deploy-Package`, 시나리오, 종료 코드는 바꾸지 마라. 이유: 2026-11-04에 같은 빌드 설정을 환경 변수로 넣어 이 코드 그대로 Release 스모크가 통과하는 것을 확인했다.

      이 파일은 패치 도구로 고친다. 읽기는 `cat`이나 `Get-Content`로 할 수 있다. 다른 셸 명령에 `tools/smoke/` 경로를 넣지 마라. 이유: `.codex/hooks/guard.py`가 막는다. 스크립트를 실행하지 마라. 이유: ADR-009에 따라 Claude만 실행한다. 마무리 때 Claude가 실행해 확인한다.

      문서를 고친다.

      - CLAUDE.md "그 밖의 명령" 표의 앱 실행 확인 명령을 `pwsh -NoProfile -File tools/smoke/Smoke.ps1 [-Configuration Release] [-Scenario launch,relaunch,startup,language,media,popupsize,tray]`로 바꾼다.
      - CLAUDE.md "주의"의 "Claude도 앱은 ..."으로 시작하는 줄에서 첫 문장 뒤에 다음 문장을 넣는다: App을 바꾼 하네스 계획을 마무리할 때는 `-Configuration Release`로 돌립니다. 트리밍 문제는 Release에서만 드러나기 때문입니다.
      - docs/ADR.md ADR-009 **결정**의 "하네스에서는 App을 바꾼 계획을 마무리할 때 한 번 돌리고, 스텝마다 돌리지 않습니다."를 "하네스에서는 App을 바꾼 계획을 마무리할 때 `-Configuration Release`로 한 번 돌리고, 스텝마다 돌리지 않습니다."로 바꾼다.

      새 시나리오를 추가하지 마라. 이유: 이 스텝은 빌드 구성만 고를 수 있게 한다.
    expected_files:
      - tools/smoke/Smoke.ps1
      - CLAUDE.md
      - docs/ADR.md
    ac:
      - 'dotnet build src/Soriseom.App -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never'
      - 'dotnet build src/Soriseom.App -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never'
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'
  - id: s3-ci-workflow
    title: run checks and release packaging on github actions
    type: ci
    description: |
      먼저 읽을 파일: CLAUDE.md ("명령어"), docs/ARCHITECTURE.md ("횡단 관심사"의 CI 항목), docs/ADR.md (ADR-007, ADR-009, ADR-010).

      `.github/workflows/ci.yml`을 새로 만든다. `.github/`는 아직 없다. 구성은 다음과 같다.

      - `name: CI`
      - 트리거: `push`의 `branches: ["**"]`와 `pull_request`. 이유: 태그 push는 Store 제출 워크플로(ADR-007) 몫이라 이 워크플로를 돌리지 않는다. 포크의 PR도 검사해야 한다.
      - `permissions: contents: read`
      - job 하나(`build`), `runs-on: windows-latest`. 이유: WinUI 3와 MSIX는 Windows에서만 빌드된다.
      - 스텝을 이 순서로 둔다.
        1. `actions/checkout@v7`
        2. `actions/setup-dotnet@v6`, `dotnet-version: 10.0.x`. 이유: 저장소는 .NET 10이고 `global.json`에 SDK 버전 고정이 없다.
        3. `Build`: `dotnet build Soriseom.slnx -p:Platform=x64`
        4. `Test`: `dotnet test --project tests/Soriseom.Core.Tests`
        5. `Check format`: `dotnet format Soriseom.slnx --verify-no-changes`
        6. `Build release package`: `dotnet build src/Soriseom.App -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false`

      다음을 넣지 마라.
      - Store 제출, 태그 트리거, secrets 참조. 이유: 별도 작업이다(ADR-007).
      - 스모크 실행. 이유: ADR-009에 따라 CI에서 돌리지 않는다.
      - matrix(ARM64, x86), NuGet 캐시, 아티팩트 업로드, `continue-on-error`, `concurrency`. 이유: 요청 범위 밖이다. 실패를 숨기면 안 된다.
      - `.gitattributes`와 `global.json` 변경. 이유: 2026-11-04에 LF로 받은 새 클론에서 위 3~5번 명령이 그대로 통과했다.

      docs/ARCHITECTURE.md "횡단 관심사"의 CI 항목을 다음으로 바꾼다:
      - **CI**: GitHub Actions(Windows runner). `.github/workflows/ci.yml`이 브랜치 push와 PR에서 빌드, 테스트, 포맷 검사, x64 Release MSIX 생성을 돌립니다. `vX.Y.Z` 태그를 push하면 패키지 버전 `X.Y.Z.0`으로 MSIX를 만들어 Store에 제출하고, 인증을 통과하면 자동으로 게시합니다(아직 없음, ADR-007).

      워크플로는 로컬에서 실행할 수 없다. AC의 actionlint는 문법과 action 입력만 검사하므로, 위 명령은 표에 적힌 그대로 써라.
    expected_files:
      - .github/workflows/ci.yml
      - docs/ARCHITECTURE.md
    ac:
      - 'uvx --from actionlint-py actionlint .github/workflows/ci.yml'
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'
      - 'dotnet build src/Soriseom.App -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false'
