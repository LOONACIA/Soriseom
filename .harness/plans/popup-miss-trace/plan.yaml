id: popup-miss-trace
goal: >
  스모크의 media 시나리오에서 드물게 두 테스트 곡 모두 팝업이 뜨지 않는 문제의 원인을 가를 증거를 남긴다.
  앱은 Debug 빌드에서 곡 정보 수신부터 창 표시까지의 경로를 디버그 출력으로 남기고, 스모크 스크립트는 그 출력을
  자신의 동작 기록과 함께 `<OutDir>/app-trace.log`에 저장한다. 완료는 빌드, 테스트, 포맷 검사가 통과하고 앱의
  동작이 바뀌지 않은 상태다. 원인 수정은 이 계획에 넣지 않는다. 증거가 나온 뒤 별도 스텝이나 계획으로 다룬다.
approved: true
steps:
  - id: s1-popup-trace
    title: trace the popup decision path in debug builds
    type: feat
    scope: app
    description: |
      먼저 읽을 파일: CLAUDE.md, docs/ARCHITECTURE.md("데이터 흐름", "횡단 관심사"의 로깅), docs/ADR.md(ADR-009의 "하네스에 미치는 영향"), `src/Soriseom.App/MediaSessionAdapter.cs`, `src/Soriseom.App/PopupController.cs`, `src/Soriseom.App/PopupWindow.xaml.cs`, `src/Soriseom.Core/PopupDecider.cs`.

      배경: 스모크의 media 시나리오에서 드물게 두 테스트 곡 모두 팝업이 뜨지 않는다. 테스트 세션은 내내 현재 세션이었고, 설정 창의 앱 목록에는 행이 생겼으며, Win32로 봐도 팝업 창이 없었다. 원인을 모르므로 이벤트 수신, UI 스레드 도착, 곡 정보 읽기, 판단, 타이머, 창 표시 각 지점을 기록한다.

      이 스텝은 기록만 추가한다. 앱의 동작을 바꾸지 마라. 이유: 원인을 확정하기 전에 동작을 고치면 증거가 사라진다. 특히 `PopupController.StartAsync`의 `_adapter.Changed` 구독 순서를 옮기지 마라. `src/Soriseom.Core`와 테스트도 건드리지 마라. 기존 `Debug.WriteLine` 호출은 그대로 둔다.

      제목, 아티스트, 앱 ID 원문을 메시지에 넣지 마라. 예외 메시지와 `exception.ToString()`도 넣지 마라. 이유: 다음 스텝에서 스모크가 이 출력을 파일에 저장하는데, ADR-009는 사용자의 데이터를 로그에 남기지 못하게 한다. 해당 값은 `PopupTrace.Mask`를 거치고, 예외는 `PopupTrace.Failure`로 형식 이름과 HRESULT만 남긴다.

      ## 1. `src/Soriseom.App/PopupTrace.cs` (새 파일)
      아래 내용 그대로 만든다.
      ```csharp
      using System.Diagnostics;
      using System.Globalization;

      namespace Soriseom.App;

      // Debug builds only. The smoke script saves these lines to tell why a popup did not appear,
      // so a message must never hold a title, an artist or an app ID. See docs/ADR.md ADR-009.
      internal static class PopupTrace
      {
          private const string Prefix = "SoriseomTrace ";

          [Conditional("DEBUG")]
          public static void Write(string message) => Debug.WriteLine(Prefix + message);

          [Conditional("DEBUG")]
          public static void Failure(string what, Exception exception) =>
              Write($"{what} failed {exception.GetType().Name} 0x{exception.HResult:X8}");

          // String hashes differ per process, so equal values mean equal text only within one run.
          public static string Mask(string? text) => string.IsNullOrEmpty(text)
              ? "empty"
              : text.GetHashCode(StringComparison.Ordinal).ToString("X8", CultureInfo.InvariantCulture);
      }
      ```

      ## 2. `src/Soriseom.App/MediaSessionAdapter.cs`
      - `StartAsync`: `RequestAsync` 호출 앞뒤에 `PopupTrace.Write("adapter request begin");`, `PopupTrace.Write("adapter request end");`를 넣는다. `await AttachCurrentSessionAsync();` 다음에 `PopupTrace.Write("adapter start end");`를 넣는다. catch의 맨 앞에 `PopupTrace.Failure("adapter start", exception);`를 넣는다.
      - 이벤트 처리기 세 개: `TryEnqueue`의 결과를 받아 기록한다. 큐에 넣지 못한 경우도 드러내기 위해서다.
      ```csharp
      bool queued = _dispatcherQueue.TryEnqueue(async () => await AttachCurrentSessionAsync());
      PopupTrace.Write($"event session queued={queued}");
      ```
      나머지 둘도 같은 모양으로 `event properties queued=`, `event playback queued=`를 쓴다.
      - `AttachCurrentSessionAsync`: `_session = _manager?.GetCurrentSession();` 다음에 넣는다.
      ```csharp
      PopupTrace.Write($"attach session={PopupTrace.Mask(_session?.SourceAppUserModelId)} version={_readVersion}");
      ```
      catch의 맨 앞에 `PopupTrace.Failure("attach", exception);`를 넣는다.
      - `RefreshMediaPropertiesAsync`:
        - `var version = ++_readVersion;` 다음에 `PopupTrace.Write($"read begin version={version}");`
        - 버전이나 세션이 달라 버리는 `return` 앞에 `PopupTrace.Write($"read dropped version={version} latest={_readVersion} sameSession={session == _session}");`
        - `CurrentThumbnail = properties.Thumbnail;` 다음, `Changed?.Invoke` 앞에 넣는다.
        ```csharp
        PopupTrace.Write($"read end version={version} app={PopupTrace.Mask(session.SourceAppUserModelId)} title={PopupTrace.Mask(properties.Title)} artist={PopupTrace.Mask(properties.Artist)} playing={isPlaying} thumbnail={properties.Thumbnail is not null}");
        ```
        - catch의 맨 앞에 `PopupTrace.Failure($"read version={version}", exception);`. 이 catch는 `Changed` 구독자(`Evaluate`)의 예외도 받는다.
      - `RefreshPlaybackInfo`: 맨 앞 `if`의 `return` 앞에 `PopupTrace.Write("playback skipped");`, `Current`를 넣은 다음 `Changed?.Invoke` 앞에 `PopupTrace.Write($"playback playing={isPlaying}");`, catch의 맨 앞에 `PopupTrace.Failure("playback", exception);`.

      ## 3. `src/Soriseom.App/PopupController.cs`
      - 생성자의 타이머 처리기: `_reevaluateTimer.Tick`을 블록으로 바꿔 `Evaluate();` 앞에 `PopupTrace.Write("reevaluate tick");`를 넣는다. `_hideTimer.Tick`의 맨 앞에 `PopupTrace.Write("hide tick");`를 넣는다.
      - `StartAsync`: 맨 앞에 `PopupTrace.Write("controller start begin");`, `_adapter.Changed` 구독 다음 줄에 `PopupTrace.Write("controller subscribed");`.
      - `Evaluate`:
        - `_store.Update(...)` 앞뒤에 `PopupTrace.Write("store update begin");`, `PopupTrace.Write("store update end");`. 새 앱을 보면 이 호출 안에서 설정 창이 앱 이름을 Shell로 읽으므로, 여기서 UI 스레드가 얼마나 멈추는지 보기 위해서다.
        - `IsFullscreen()`과 `IsDoNotDisturb()`의 결과를 지역 변수 `isFullscreen`, `isDoNotDisturb`에 담아 `Decide`에 넘긴다. 호출 순서와 인자 값은 그대로다.
        - `Decide` 호출 다음에 넣는다.
        ```csharp
        PopupTrace.Write($"evaluate app={PopupTrace.Mask(_adapter.Current?.AppId)} title={PopupTrace.Mask(_adapter.Current?.Title)} artist={PopupTrace.Mask(_adapter.Current?.Artist)} playing={_adapter.Current?.IsPlaying} appEnabled={_adapter.Current is null || settings.IsAppEnabled(_adapter.Current.AppId)} fullscreen={isFullscreen} dnd={isDoNotDisturb} action={decision.Action} reevaluateMs={(decision.ReevaluateAt - now)?.TotalMilliseconds}");
        ```
        메서드 뒤쪽에 패턴 변수 `current`가 있으니 같은 이름의 지역 변수를 만들지 마라.

      ## 4. `src/Soriseom.App/PopupWindow.xaml.cs`
      - `ShowTrack`의 맨 앞에 `PopupTrace.Write($"window show visible={_isVisible} closing={_isClosing}");`
      - `AppWindow.Show(false);` 다음에 `PopupTrace.Write($"window shown isVisible={AppWindow.IsVisible}");`
      - `HidePopup`: 맨 앞 `if` 다음에 `PopupTrace.Write("window hide begin");`, `batch.Completed` 처리기의 맨 앞에 `PopupTrace.Write($"window hide completed current={version == _animationVersion}");`

      ## 5. `docs/ARCHITECTURE.md`
      "횡단 관심사"의 로깅 항목 끝에 다음 문장을 더한다. 다른 줄은 바꾸지 마라.
      `팝업 판단 경로는 Debug 빌드에서 `PopupTrace`로 출력합니다. Release에서는 호출 자체가 빠집니다. 스모크 스크립트가 이 출력을 저장하므로 제목, 아티스트, 앱 ID는 프로세스마다 달라지는 해시로만 남기고 예외는 형식과 HRESULT만 남깁니다.`

      앱을 실행하지 마라(`dotnet run`, exe 실행, 패키지 등록, `tools/smoke/` 포함). 이유: ADR-009. 빌드와 포맷 검사로만 확인한다.
    expected_files:
      - src/Soriseom.App/PopupTrace.cs
      - src/Soriseom.App/MediaSessionAdapter.cs
      - src/Soriseom.App/PopupController.cs
      - src/Soriseom.App/PopupWindow.xaml.cs
      - docs/ARCHITECTURE.md
    ac:
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'
      - 'dotnet build src/Soriseom.App -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false'

  - id: s2-smoke-trace-capture
    title: save the app trace in the smoke script
    type: feat
    scope: tools
    description: |
      먼저 읽을 파일: CLAUDE.md("명령어"의 "주의"), docs/ADR.md(ADR-009), `tools/smoke/Smoke.ps1` 전체, `src/Soriseom.App/PopupTrace.cs`(이전 스텝에서 만듦).

      목표: `Smoke.ps1`이 실행 내내 앱의 `PopupTrace` 출력을 받아, 스크립트 자신의 동작 표시와 함께 시간순으로 `<OutDir>/app-trace.log`에 저장한다. 팝업이 안 떴을 때 이 파일 하나로 어디서 멈췄는지 보기 위해서다. 스크립트의 판정, 시나리오 순서, 대기 시간, 종료 코드는 바꾸지 마라. 이유: 이 스텝은 기록만 추가한다.

      받는 방식은 `OutputDebugString`의 공유 메모리(`DBWIN_BUFFER`)다. 2026-11-04에 같은 코드로 패키지 앱의 Debug 출력을 받는 것을 확인했으니 다른 방식으로 바꾸지 마라. `SoriseomTrace `로 시작하는 줄만 저장하고 나머지는 버린다. 이유: 다른 프로세스와 프레임워크의 디버그 출력에 사용자의 데이터가 있을 수 있다(ADR-009). 파일 첫 줄부터 그 접두사가 있는 줄과 스크립트 표시만 들어가야 한다.

      ## 1. `tools/smoke/Smoke.ps1`
      - `Add-Type -TypeDefinition`의 C# 블록: `using` 목록에 `System.IO`, `System.Text`, `System.Threading`을 더하고, `SmokeNative` 클래스 뒤에 아래 클래스를 추가한다. `Mark`와 `Start`는 반환값이 `void`여야 한다. 이유: 값을 돌려주면 PowerShell 함수의 반환값에 섞인다.
      ```csharp
      // Saves the app's PopupTrace lines beside the script's own marks. The app writes them through OutputDebugString.
      public static class SmokeTrace {
          const string Prefix = "SoriseomTrace ";
          static readonly object Gate = new object();
          static StreamWriter writer;
          [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] static extern IntPtr CreateEventW(IntPtr attributes, bool manualReset, bool initialState, string name);
          [DllImport("kernel32.dll")] static extern bool SetEvent(IntPtr handle);
          [DllImport("kernel32.dll")] static extern uint WaitForSingleObject(IntPtr handle, uint milliseconds);
          [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)] static extern IntPtr CreateFileMappingW(IntPtr file, IntPtr attributes, uint protect, uint sizeHigh, uint sizeLow, string name);
          [DllImport("kernel32.dll", SetLastError = true)] static extern IntPtr MapViewOfFile(IntPtr mapping, uint access, uint offsetHigh, uint offsetLow, UIntPtr bytes);

          public static void Start(string path) {
              IntPtr ready = CreateEventW(IntPtr.Zero, false, false, "DBWIN_BUFFER_READY");
              IntPtr data = CreateEventW(IntPtr.Zero, false, false, "DBWIN_DATA_READY");
              IntPtr mapping = CreateFileMappingW(new IntPtr(-1), IntPtr.Zero, 4, 0, 4096, "DBWIN_BUFFER");
              IntPtr view = mapping == IntPtr.Zero ? IntPtr.Zero : MapViewOfFile(mapping, 4, 0, 0, new UIntPtr(4096));
              if (ready == IntPtr.Zero || data == IntPtr.Zero || view == IntPtr.Zero) {
                  throw new System.ComponentModel.Win32Exception();
              }

              writer = new StreamWriter(path, false, new UTF8Encoding(false));
              var thread = new Thread(() => {
                  while (true) {
                      SetEvent(ready);
                      if (WaitForSingleObject(data, 1000) != 0) continue;
                      int pid = Marshal.ReadInt32(view);
                      string message = Marshal.PtrToStringAnsi(view + 4);
                      if (message != null && message.StartsWith(Prefix, StringComparison.Ordinal)) {
                          Append("app pid=" + pid + " " + message.Substring(Prefix.Length).TrimEnd());
                      }
                  }
              });
              thread.IsBackground = true;
              thread.Start();
          }

          public static void Mark(string text) {
              Append("smoke " + text);
          }

          static void Append(string text) {
              lock (Gate) {
                  if (writer == null) return;
                  writer.WriteLine(DateTime.Now.ToString("HH:mm:ss.fff") + " " + text);
                  writer.Flush();
              }
          }
      }
      ```
      - 시작: `$OutDir = (Resolve-Path $OutDir).Path` 다음에 넣는다. 시작하지 못해도 검사는 계속한다. 이유: 기록 때문에 스모크가 실패하면 안 된다.
      ```powershell
      $TracePath = Join-Path $OutDir 'app-trace.log'
      try {
          [SmokeTrace]::Start($TracePath)
      } catch {
          Write-Line "app trace unavailable: $($_.Exception.Message)"
      }
      ```
      - 경로 출력: 마지막 `if ($script:FailedChecks -eq 0 -and -not $script:UnavailableReason) { exit 0 }` 바로 앞에 `Write-Line "app trace $TracePath"`를 넣는다.
      - 표시를 넣을 곳. 모두 `[SmokeTrace]::Mark(...)`로 호출한다.
        - 시나리오 `foreach`의 `Write-Line "--- $name"` 다음: `"scenario $name"`
        - `Stop-App`의 끝: `'app stopped'`
        - `Open-Settings`의 끝: `'settings window open'`
        - `Watch-Popup`: `if (-not $popup) { return $seen }`를 블록으로 바꿔 `return` 앞에 `"popup not seen $Title"`. `$seen.Shown = $true` 다음에 `"popup seen $Title"`. `$seen.Duration = ...` 앞에 `"popup gone $Title"`. `$Title`은 테스트 곡 제목만 들어온다.
        - `Watch-FixtureTracks`: `$fixture = Start-Process ...` 앞에 `'fixture start'`. `$status = Get-Content ...` 다음 줄에 넣는다.
        ```powershell
        [SmokeTrace]::Mark("fixture done current first=$($status[$FirstTrack]) second=$($status[$SecondTrack]) shown first=$($first.Shown) second=$($second.Shown) fullscreen first=$($first.FullScreen) second=$($second.FullScreen)")
        ```
      - 머리말: `.DESCRIPTION`의 첫 문단 뒤에 빈 줄과 함께 `Saves the app's popup trace to app-trace.log in OutDir. A Release build has no trace, so only the script's own lines appear there.`를 넣는다. `.PARAMETER OutDir`를 `Where screenshots and app-trace.log go. Defaults to a new temp directory.`로 바꾼다.
      - `-AfterSignIn` 경로는 건드리지 마라. 이유: 읽기 전용 검사이고 `$OutDir`을 정하기 전에 끝난다. `Start`를 부르지 않으면 `Mark`는 아무것도 하지 않는다.
      - 파일의 줄바꿈(LF)을 유지한다.

      ## 2. `docs/ADR.md`
      ADR-009의 "하네스에 미치는 영향" 항목 끝에 다음 문장을 더한다. 다른 줄은 바꾸지 마라.
      `스크립트는 앱의 `PopupTrace` 출력을 `<OutDir>/app-trace.log`에 저장합니다. Release 빌드에는 이 출력이 없으니, 판단 경로를 봐야 하는 실패는 Debug로 다시 돌립니다.`

      `tools/smoke/`를 실행하거나 경로로 참조하는 명령을 쓰지 마라. 이유: 앱을 띄우는 스크립트이고 `.codex/hooks/guard.py`가 막는다. 이 스크립트의 첫 실행 확인은 커밋 뒤에 Claude가 한다.
    expected_files:
      - tools/smoke/Smoke.ps1
      - docs/ADR.md
    ac:
      - 'dotnet build Soriseom.slnx -p:Platform=x64'
      - 'dotnet test --project tests/Soriseom.Core.Tests'
      - 'dotnet format Soriseom.slnx --verify-no-changes'
