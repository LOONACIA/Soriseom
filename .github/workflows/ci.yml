name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Soriseom.slnx -p:Platform=x64
      - name: Test
        run: dotnet test --project tests/Soriseom.Core.Tests
      - name: Check format
        run: dotnet format Soriseom.slnx --verify-no-changes
      - name: Build release package
        run: dotnet build src/Soriseom.App -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false
